<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Chox Browser</title>

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0d;
  --panel2:#111114;
  --line:#25252a;
  --red:#e00000;
  --red2:#8d0000;
  --text:#f4f4f4;
  --muted:#96969e;
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}

.app{height:100vh;display:flex;flex-direction:column;background:
  radial-gradient(circle at 50% -20%,rgba(150,0,0,.16),transparent 35%),
  #050505}

.tabs{
  height:42px;display:flex;align-items:flex-end;padding:6px 8px 0;
  background:#080808;border-bottom:1px solid #1d1d20;gap:5px
}
.tab{
  height:36px;min-width:170px;max-width:240px;padding:0 10px 0 13px;
  display:flex;align-items:center;gap:9px;border:1px solid #242428;
  border-bottom:0;border-radius:9px 9px 0 0;background:#0e0e10;color:#bbb;
  cursor:pointer
}
.tab.active{background:#17171a;color:white;border-color:#3a3a40}
.tab-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tab-close{border:0;background:none;color:#777;cursor:pointer;font-size:17px}
.tab-close:hover{color:white}
.newtab{
  width:34px;height:34px;margin-bottom:1px;border:0;background:none;color:#aaa;
  font-size:23px;cursor:pointer
}
.newtab:hover{color:white}

.toolbar{
  min-height:58px;display:flex;align-items:center;gap:7px;padding:9px 10px;
  background:#0b0b0d;border-bottom:1px solid #242428
}
.tool{
  width:36px;height:36px;border:1px solid #29292e;border-radius:8px;
  background:#121216;color:#ddd;cursor:pointer
}
.tool:hover{border-color:#6b1111;background:#18181c}
.address{
  flex:1;height:38px;display:flex;align-items:center;border:1px solid #29292e;
  border-radius:10px;background:#070708;padding:0 12px;gap:8px
}
.address-icon{color:#777}
.address input{
  flex:1;border:0;outline:0;background:transparent;color:white;font-size:14px
}
.go{
  height:30px;padding:0 13px;border:1px solid #651010;border-radius:7px;
  background:linear-gradient(#a90000,#5d0000);color:white;cursor:pointer
}
.go:hover{filter:brightness(1.15)}

.workspace{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0;display:none}
.page.active{display:block}

.home{
  height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;
  padding:70px 20px 50px
}
.logo{
  width:78px;height:78px;border-radius:22px;display:grid;place-items:center;
  font-size:29px;font-weight:900;letter-spacing:-3px;color:white;
  background:linear-gradient(145deg,#d00000,#650000);
  border:1px solid #ef2525;box-shadow:0 0 35px rgba(180,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12)
}
.brand{font-size:42px;font-weight:900;letter-spacing:5px;margin-top:20px}
.subtitle{color:#777;margin-top:7px;font-size:14px}
.searchbox{
  width:min(720px,94%);height:54px;margin-top:31px;display:flex;align-items:center;
  border:1px solid #34343a;border-radius:15px;background:#0d0d10;
  box-shadow:0 15px 50px rgba(0,0,0,.3)
}
.searchbox:focus-within{border-color:#8e1616;box-shadow:0 0 0 3px rgba(160,0,0,.08)}
.searchbox span{padding-left:17px;color:#777;font-size:20px}
.searchbox input{flex:1;height:100%;border:0;outline:0;background:transparent;color:white;padding:0 12px;font-size:16px}
.searchbox button{
  margin-right:7px;height:40px;padding:0 18px;border:0;border-radius:10px;
  background:linear-gradient(#bd0000,#650000);color:white;font-weight:700;cursor:pointer
}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.quick button{
  border:1px solid #29292e;background:#101014;color:#bbb;border-radius:9px;
  padding:9px 13px;cursor:pointer
}
.quick button:hover{color:white;border-color:#721212}

.browser-frame{
  width:100%;height:100%;border:0;background:white
}
.loading{
  position:absolute;inset:0;display:none;place-items:center;background:#050505;
  z-index:5;color:#aaa
}
.loading.show{display:grid}
.loading-box{text-align:center}
.spinner{
  width:34px;height:34px;margin:0 auto 12px;border:3px solid #333;
  border-top-color:#d00000;border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

.overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;z-index:20;
  align-items:center;justify-content:center
}
.overlay.show{display:flex}
.modal{
  width:min(520px,92%);background:#101013;border:1px solid #37373d;
  border-radius:16px;box-shadow:0 30px 100px #000;padding:22px
}
.modal h2{margin:0 0 18px}
.setting{
  padding:13px 0;border-bottom:1px solid #242428;color:#bbb
}
.setting small{display:block;color:#777;margin-top:5px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal button{
  border:1px solid #34343a;background:#18181c;color:white;border-radius:8px;
  padding:9px 14px;cursor:pointer
}
.modal .danger{background:#690000;border-color:#980000}

.empty{
  height:100%;display:grid;place-items:center;background:#080809;color:#888;
  text-align:center;padding:30px
}
.empty strong{display:block;color:#ddd;font-size:20px;margin-bottom:8px}
</style>
</head>

<body>
<div class="app">

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <button class="tool" id="backBtn" title="Back">←</button>
    <button class="tool" id="forwardBtn" title="Forward">→</button>
    <button class="tool" id="reloadBtn" title="Reload">↻</button>
    <button class="tool" id="homeBtn" title="Home">⌂</button>

    <div class="address">
      <span class="address-icon">🔒</span>
      <input id="addressInput" placeholder="Search or enter a website address">
      <button class="go" id="goBtn">Go</button>
    </div>

    <button class="tool" id="bookmarkBtn" title="Bookmark">☆</button>
    <button class="tool" id="settingsBtn" title="Settings">⚙</button>
  </div>

  <div class="workspace" id="workspace"></div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <h2>Chox Settings</h2>
      <div class="setting">
        <b>Search engine</b>
        <small>SearXNG — searches are displayed inside this Chox page.</small>
      </div>
      <div class="setting">
        <b>Search provider</b>
        <small>searx.tiekoetter.com</small>
      </div>
      <div class="setting">
        <b>Privacy</b>
        <small>Chox stores bookmarks and browser history locally in your browser.</small>
      </div>
      <div class="modal-actions">
        <button id="clearDataBtn" class="danger">Clear Chox Data</button>
        <button id="closeSettingsBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
/*
  CHOX GITHUB PAGES EDITION

  IMPORTANT:
  - This file has no Node.js server.
  - It is designed to be uploaded directly to GitHub Pages.
  - Search results are loaded into a Chox page instead of opening a new browser tab.
  - If a website refuses iframe embedding, Chox shows the site's error/fallback;
    that restriction is controlled by the website, not Chox.
*/

const SEARCH_ENGINE = "https://searx.tiekoetter.com/search";
const HOME_URL = "chox-home://home";

const tabs = [];
let activeTabId = null;
let nextTabId = 1;

const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function createTab(url = HOME_URL, title = "New Tab"){
  const id = nextTabId++;
  const tab = {
    id,
    title,
    url,
    history: [url],
    historyIndex: 0,
    bookmarks: false
  };
  tabs.push(tab);
  activeTabId = id;
  renderTabs();
  renderWorkspace();
  return tab;
}

function getActiveTab(){
  return tabs.find(t => t.id === activeTabId);
}

function renderTabs(){
  const box = $("tabs");
  box.innerHTML = "";

  tabs.forEach(tab => {
    const el = document.createElement("div");
    el.className = "tab" + (tab.id === activeTabId ? " active" : "");
    el.innerHTML = `
      <span>🌐</span>
      <span class="tab-title">${escapeHtml(tab.title)}</span>
      <button class="tab-close" aria-label="Close">×</button>
    `;

    el.addEventListener("click", e => {
      if(e.target.classList.contains("tab-close")){
        closeTab(tab.id);
        return;
      }
      activeTabId = tab.id;
      renderTabs();
      renderWorkspace();
    });

    box.appendChild(el);
  });

  const add = document.createElement("button");
  add.className = "newtab";
  add.textContent = "+";
  add.title = "New tab";
  add.onclick = () => createTab();
  box.appendChild(add);
}

function closeTab(id){
  const index = tabs.findIndex(t => t.id === id);
  if(index < 0) return;

  tabs.splice(index,1);

  if(!tabs.length){
    createTab();
    return;
  }

  if(activeTabId === id){
    activeTabId = tabs[Math.max(0,index-1)].id;
  }

  renderTabs();
  renderWorkspace();
}

function isHome(url){
  return url === HOME_URL;
}

function isSearch(url){
  return url.startsWith(SEARCH_ENGINE);
}

function renderWorkspace(){
  const workspace = $("workspace");
  workspace.innerHTML = "";

  const tab = getActiveTab();
  if(!tab) return;

  $("addressInput").value = isHome(tab.url) ? "" : tab.url;

  if(isHome(tab.url)){
    const page = document.createElement("div");
    page.className = "page active";
    page.innerHTML = `
      <div class="home">
        <div class="logo">CH</div>
        <div class="brand">CHOX</div>
        <div class="subtitle">Fast. Simple. Yours.</div>

        <form class="searchbox" id="homeSearch">
          <span>⌕</span>
          <input id="homeSearchInput" autocomplete="off" placeholder="Search the web with Chox">
          <button type="submit">Search</button>
        </form>

        <div class="quick">
          <button data-q="latest technology">Technology</button>
          <button data-q="gaming news">Gaming</button>
          <button data-q="computer help">Computer Help</button>
          <button data-q="science">Science</button>
        </div>
      </div>
    `;

    workspace.appendChild(page);

    $("homeSearch").addEventListener("submit", e => {
      e.preventDefault();
      const q = $("homeSearchInput").value.trim();
      if(q) search(q);
    });

    page.querySelectorAll("[data-q]").forEach(btn => {
      btn.onclick = () => search(btn.dataset.q);
    });

    return;
  }

  const page = document.createElement("div");
  page.className = "page active";

  const frame = document.createElement("iframe");
  frame.className = "browser-frame";
  frame.setAttribute("allow", "fullscreen; autoplay; picture-in-picture");
  frame.referrerPolicy = "no-referrer-when-downgrade";

  const loading = document.createElement("div");
  loading.className = "loading show";
  loading.innerHTML = `
    <div class="loading-box">
      <div class="spinner"></div>
      <div>Loading in Chox...</div>
    </div>
  `;

  page.appendChild(frame);
  page.appendChild(loading);
  workspace.appendChild(page);

  frame.addEventListener("load", () => {
    loading.classList.remove("show");
  });

  frame.addEventListener("error", () => {
    loading.classList.remove("show");
  });

  frame.src = tab.url;
}

function navigate(url, title){
  const tab = getActiveTab();
  if(!tab) return;

  if(!url) return;

  if(url.startsWith("http://") || url.startsWith("https://")){
    // good
  } else if(url.includes(".") && !url.includes(" ")){
    url = "https://" + url;
  } else {
    search(url);
    return;
  }

  if(tab.history[tab.historyIndex] !== url){
    tab.history = tab.history.slice(0, tab.historyIndex + 1);
    tab.history.push(url);
    tab.historyIndex++;
  }

  tab.url = url;
  tab.title = title || getTitleFromUrl(url);

  saveHistory(url);
  renderTabs();
  renderWorkspace();
}

function search(query){
  query = String(query).trim();
  if(!query) return;

  const url = SEARCH_ENGINE + "?q=" + encodeURIComponent(query) + "&categories=general&language=auto&format=html";
  navigate(url, "Search: " + query);
}

function getTitleFromUrl(url){
  try{
    return new URL(url).hostname.replace(/^www\./,"");
  }catch{
    return "Chox";
  }
}

function goBack(){
  const tab = getActiveTab();
  if(!tab || tab.historyIndex <= 0) return;

  tab.historyIndex--;
  tab.url = tab.history[tab.historyIndex];
  tab.title = isHome(tab.url) ? "New Tab" : getTitleFromUrl(tab.url);
  renderTabs();
  renderWorkspace();
}

function goForward(){
  const tab = getActiveTab();
  if(!tab || tab.historyIndex >= tab.history.length - 1) return;

  tab.historyIndex++;
  tab.url = tab.history[tab.historyIndex];
  tab.title = isHome(tab.url) ? "New Tab" : getTitleFromUrl(tab.url);
  renderTabs();
  renderWorkspace();
}

function reload(){
  const tab = getActiveTab();
  if(!tab) return;
  renderWorkspace();
}

function goHome(){
  const tab = getActiveTab();
  if(!tab) return;

  tab.url = HOME_URL;
  tab.title = "New Tab";
  tab.history = [HOME_URL];
  tab.historyIndex = 0;
  renderTabs();
  renderWorkspace();
}

function saveHistory(url){
  if(isHome(url)) return;

  let history = JSON.parse(localStorage.getItem("choxHistory") || "[]");
  history = history.filter(x => x.url !== url);
  history.unshift({
    url,
    time: Date.now()
  });
  localStorage.setItem("choxHistory", JSON.stringify(history.slice(0,100)));
}

function toggleBookmark(){
  const tab = getActiveTab();
  if(!tab || isHome(tab.url)) return;

  let bookmarks = JSON.parse(localStorage.getItem("choxBookmarks") || "[]");

  const existing = bookmarks.findIndex(x => x.url === tab.url);

  if(existing >= 0){
    bookmarks.splice(existing,1);
    tab.bookmarks = false;
  }else{
    bookmarks.unshift({
      title: tab.title,
      url: tab.url
    });
    tab.bookmarks = true;
  }

  localStorage.setItem("choxBookmarks", JSON.stringify(bookmarks));
  $("bookmarkBtn").textContent = tab.bookmarks ? "★" : "☆";
}

function updateBookmarkButton(){
  const tab = getActiveTab();
  if(!tab || isHome(tab.url)){
    $("bookmarkBtn").textContent = "☆";
    return;
  }

  const bookmarks = JSON.parse(localStorage.getItem("choxBookmarks") || "[]");
  $("bookmarkBtn").textContent =
    bookmarks.some(x => x.url === tab.url) ? "★" : "☆";
}

$("backBtn").onclick = goBack;
$("forwardBtn").onclick = goForward;
$("reloadBtn").onclick = reload;
$("homeBtn").onclick = goHome;
$("bookmarkBtn").onclick = toggleBookmark;

$("goBtn").onclick = () => {
  navigate($("addressInput").value.trim());
};

$("addressInput").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    e.preventDefault();
    navigate(e.target.value.trim());
  }
});

$("settingsBtn").onclick = () => {
  $("settingsOverlay").classList.add("show");
};

$("closeSettingsBtn").onclick = () => {
  $("settingsOverlay").classList.remove("show");
};

$("settingsOverlay").addEventListener("click", e => {
  if(e.target === $("settingsOverlay")){
    $("settingsOverlay").classList.remove("show");
  }
});

$("clearDataBtn").onclick = () => {
  if(confirm("Clear Chox bookmarks and history?")){
    localStorage.removeItem("choxHistory");
    localStorage.removeItem("choxBookmarks");
    $("settingsOverlay").classList.remove("show");
    updateBookmarkButton();
  }
};

document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "l"){
    e.preventDefault();
    $("addressInput").focus();
    $("addressInput").select();
  }

  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "t"){
    e.preventDefault();
    createTab();
  }

  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "w"){
    e.preventDefault();
    closeTab(activeTabId);
  }

  if(e.altKey && e.key === "ArrowLeft"){
    e.preventDefault();
    goBack();
  }

  if(e.altKey && e.key === "ArrowRight"){
    e.preventDefault();
    goForward();
  }
});

const first = createTab();
updateBookmarkButton();

// Keep bookmark icon correct whenever the active tab changes.
const oldRenderTabs = renderTabs;
</script>
</body>
</html>
