<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #0f1115;
      color: #ffffff;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0f1115;
    }

    /* =========================
       TABS
    ========================= */

    .tab-bar {
      height: 42px;
      display: flex;
      align-items: center;
      background: #17191f;
      border-bottom: 1px solid #292c34;
      padding: 0 8px;
      gap: 4px;
      user-select: none;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      min-width: 160px;
      max-width: 240px;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: #20232a;
      border-radius: 8px 8px 0 0;
      color: #aeb4c0;
      font-size: 13px;
      flex-shrink: 0;
    }

    .tab.active {
      background: #0f1115;
      color: #ffffff;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-close {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: transparent;
      color: #8d94a1;
    }

    .tab-close:hover {
      background: #30343d;
      color: white;
    }

    .new-tab {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: transparent;
      color: #aeb4c0;
      font-size: 20px;
    }

    .new-tab:hover {
      background: #292d36;
      color: white;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      background: #13151a;
      border-bottom: 1px solid #292c34;
    }

    .toolbar-button {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: transparent;
      color: #aeb4c0;
      font-size: 18px;
    }

    .toolbar-button:hover {
      background: #252932;
      color: white;
    }

    .address-wrapper {
      flex: 1;
      height: 36px;
      display: flex;
      align-items: center;
      background: #20232a;
      border: 1px solid #30343d;
      border-radius: 10px;
      padding: 0 12px;
    }

    .address-icon {
      color: #7f8795;
      margin-right: 8px;
    }

    #address-bar {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    #address-bar::placeholder {
      color: #777f8d;
    }

    /* =========================
       CONTENT
    ========================= */

    .browser-content {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .tab-page {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
      background: #0f1115;
    }

    .tab-page.active {
      display: block;
    }

    .page-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* =========================
       HOME
    ========================= */

    .home-page {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 55px 25px;
      background:
        radial-gradient(
          circle at top center,
          rgba(85, 95, 130, 0.18),
          transparent 45%
        ),
        #0f1115;
    }

    .home-container {
      width: min(1000px, 100%);
      margin: 0 auto;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e53935;
      color: #0f1115;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -4px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .brand-name {
      margin-top: 15px;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .brand-subtitle {
      margin-top: 8px;
      color: #8e96a5;
      font-size: 15px;
    }

    .search-box {
      width: min(760px, 100%);
      height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 0 18px;
      background: #1b1e24;
      border: 1px solid #30343d;
      border-radius: 16px;
      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .search-box-icon {
      color: #8f97a5;
      font-size: 20px;
      margin-right: 12px;
    }

    #home-search {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
    }

    #home-search::placeholder {
      color: #777f8d;
    }

    .search-button {
      height: 40px;
      padding: 0 18px;
      border-radius: 10px;
      background: #ffffff;
      color: #101216;
      font-weight: 700;
    }

    .search-button:hover {
      background: #e6e8ec;
    }

    .quick-links-title {
      margin: 45px 0 15px;
      color: #9aa2af;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .quick-links {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .quick-link {
      min-height: 95px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 9px;
      border-radius: 14px;
      background: #191c22;
      border: 1px solid #292d35;
      color: #ffffff;
      text-align: left;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .quick-link:hover {
      transform: translateY(-2px);
      background: #22262e;
    }

    .quick-icon {
      font-size: 23px;
    }

    .quick-link span:last-child {
      color: #c9ced7;
      font-size: 14px;
      font-weight: 600;
    }

    /* =========================
       CHOX VIDEO
    ========================= */

    .chox-video-page {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
      background: #0c0e12;
    }

    .cv-sidebar {
      width: 220px;
      flex-shrink: 0;
      padding: 18px 12px;
      background: #111319;
      border-right: 1px solid #292d35;
      overflow-y: auto;
    }

    .cv-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 20px;
      font-size: 20px;
      font-weight: 800;
    }

    .cv-brand-logo {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e53935;
      color: #101216;
      font-weight: 900;
    }

    .cv-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cv-nav-button {
      width: 100%;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 9px;
      background: transparent;
      color: #9ca4b2;
      text-align: left;
      font-size: 14px;
    }

    .cv-nav-button:hover,
    .cv-nav-button.active {
      background: #242831;
      color: white;
    }

    .cv-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cv-topbar {
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: #111319;
      border-bottom: 1px solid #292d35;
    }

    .cv-search {
      flex: 1;
      max-width: 720px;
      height: 40px;
      display: flex;
      align-items: center;
      background: #1d2027;
      border: 1px solid #30343d;
      border-radius: 10px;
      padding: 0 12px;
    }

    .cv-search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
    }

    .cv-search button {
      background: transparent;
      color: #aeb4c0;
    }

    .cv-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .cv-heading {
      margin-bottom: 20px;
    }

    .cv-heading h1 {
      margin: 0;
      font-size: 25px;
    }

    .cv-heading p {
      margin: 7px 0 0;
      color: #838b99;
      font-size: 14px;
    }

    .cv-video-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .cv-card {
      overflow: hidden;
      border-radius: 12px;
      background: #171a20;
      border: 1px solid #282c34;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .cv-card:hover {
      transform: translateY(-3px);
      background: #1e2229;
    }

    .cv-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #252932;
    }

    .cv-card-info {
      padding: 13px;
    }

    .cv-card-title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .cv-card-description {
      margin-top: 7px;
      color: #828a98;
      font-size: 12px;
      line-height: 1.4;
    }

    .cv-player {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .cv-player video,
    .cv-player iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
      background: black;
    }

    .cv-player-title {
      margin-top: 15px;
      font-size: 20px;
      font-weight: 700;
    }

    .cv-player-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .cv-action {
      padding: 9px 13px;
      border-radius: 8px;
      background: #252932;
      color: #d5dae2;
    }

    .cv-action:hover {
      background: #303540;
    }

    .cv-empty {
      padding: 60px 20px;
      text-align: center;
      color: #7e8694;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {
      .tab {
        min-width: 130px;
      }

      .toolbar-button {
        width: 32px;
      }

      .home-page {
        padding: 35px 15px;
      }

      .brand-name {
        font-size: 34px;
      }

      .cv-sidebar {
        width: 68px;
        padding: 15px 8px;
      }

      .cv-brand span:last-child,
      .cv-nav-button span:last-child {
        display: none;
      }

      .cv-nav-button {
        justify-content: center;
      }

      .cv-content {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- =========================
       TAB BAR
  ========================== -->

  <div class="tab-bar">

    <div id="tabs" class="tabs"></div>

    <button
      class="new-tab"
      title="New tab"
      onclick="createNewTab()"
    >
      +
    </button>

  </div>


  <!-- =========================
       BROWSER TOOLBAR
  ========================== -->

  <div class="toolbar">

    <button
      class="toolbar-button"
      title="Back"
      onclick="goBack()"
    >
      ←
    </button>

    <button
      class="toolbar-button"
      title="Forward"
      onclick="goForward()"
    >
      →
    </button>

    <button
      class="toolbar-button"
      title="Reload"
      onclick="reloadPage()"
    >
      ↻
    </button>

    <button
      class="toolbar-button"
      title="Home"
      onclick="goHome()"
    >
      ⌂
    </button>

    <div class="address-wrapper">

      <span class="address-icon">🔒</span>

      <input
        id="address-bar"
        type="text"
        placeholder="Search or enter a web address"
        autocomplete="off"
        spellcheck="false"
        onkeydown="handleAddressKey(event)"
      >

    </div>

  </div>


  <!-- =========================
       CONTENT
  ========================== -->

  <div
    id="browser-content"
    class="browser-content"
  ></div>

</div>


<script>

/* =========================================================
   CHOX STATE
========================================================= */

let tabs = [];
let activeTabId = null;
let tabCounter = 0;


/* =========================================================
   CREATE TAB
========================================================= */

function createNewTab(url = "") {

  tabCounter++;

  const id = `tab-${Date.now()}-${tabCounter}`;

  const tab = {
    id,
    title: "New Tab",
    url: "",
    type: "home",
    history: [],
    historyIndex: -1
  };

  tabs.push(tab);

  createTabButton(tab);
  createTabPage(tab);

  switchTab(id);

  if (url) {
    navigate(url);
  } else {
    renderHome(tab);
  }
}


/* =========================================================
   CREATE TAB BUTTON
========================================================= */

function createTabButton(tab) {

  const tabsContainer =
    document.getElementById("tabs");

  const button =
    document.createElement("div");

  button.className = "tab";

  button.id =
    `tab-button-${tab.id}`;

  button.innerHTML = `
    <span class="tab-title"></span>
    <button
      class="tab-close"
      title="Close tab"
    >
      ×
    </button>
  `;

  button.addEventListener("click", (event) => {

    if (
      event.target.classList.contains(
        "tab-close"
      )
    ) {
      closeTab(tab.id);
      return;
    }

    switchTab(tab.id);
  });

  tabsContainer.appendChild(button);

  updateTabButton(tab);
}


/* =========================================================
   UPDATE TAB BUTTON
========================================================= */

function updateTabButton(tab) {

  const button =
    document.getElementById(
      `tab-button-${tab.id}`
    );

  if (!button) return;

  const title =
    button.querySelector(".tab-title");

  title.textContent =
    tab.title || "New Tab";
}


/* =========================================================
   CREATE PAGE
========================================================= */

function createTabPage(tab) {

  const page =
    document.createElement("div");

  page.className = "tab-page";

  page.id =
    `tab-page-${tab.id}`;

  document
    .getElementById("browser-content")
    .appendChild(page);
}


/* =========================================================
   SWITCH TAB
========================================================= */

function switchTab(id) {

  activeTabId = id;

  document
    .querySelectorAll(".tab")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.id ===
          `tab-button-${id}`
      );

    });

  document
    .querySelectorAll(".tab-page")
    .forEach(page => {

      page.classList.toggle(
        "active",
        page.id ===
          `tab-page-${id}`
      );

    });

  updateAddressBar();
}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(id) {

  const index =
    tabs.findIndex(
      tab => tab.id === id
    );

  if (index === -1) return;

  document
    .getElementById(`tab-button-${id}`)
    ?.remove();

  document
    .getElementById(`tab-page-${id}`)
    ?.remove();

  tabs.splice(index, 1);

  if (tabs.length === 0) {
    createNewTab();
    return;
  }

  if (activeTabId === id) {

    const newIndex =
      Math.max(
        0,
        index - 1
      );

    switchTab(
      tabs[newIndex].id
    );
  }
}


/* =========================================================
   ACTIVE TAB
========================================================= */

function getActiveTab() {

  return tabs.find(
    tab => tab.id === activeTabId
  );
}


/* =========================================================
   ADDRESS BAR
========================================================= */

function updateAddressBar() {

  const input =
    document.getElementById(
      "address-bar"
    );

  const tab =
    getActiveTab();

  if (!tab) {
    input.value = "";
    return;
  }

  input.value =
    tab.url || "";
}


/* =========================================================
   ADDRESS KEY
========================================================= */

function handleAddressKey(event) {

  if (event.key !== "Enter") {
    return;
  }

  const value =
    event.target.value.trim();

  if (!value) return;

  openAddress(value);
}


/* =========================================================
   OPEN ADDRESS
========================================================= */

function openAddress(value) {

  const tab =
    getActiveTab();

  if (!tab) return;

  if (
    value.startsWith(
      "chox://video"
    )
  ) {

    openChoxVideoPage(tab.id);
    return;
  }

  let url = value;

  if (
    !/^https?:\/\//i.test(url)
  ) {

    if (
      value.includes(".") &&
      !value.includes(" ")
    ) {

      url =
        "https://" + value;

    } else {

      url =
        "results.html?q=" +
        encodeURIComponent(value);

      tab.type = "search";
      tab.url = url;
      tab.title = "Search";

      const page =
        document.getElementById(
          `tab-page-${tab.id}`
        );

      page.innerHTML = `
        <iframe
          class="page-frame"
          src="${url}"
        ></iframe>
      `;

      updateTabButton(tab);
      updateAddressBar();

      return;
    }
  }

  navigate(url);
}


/* =========================================================
   NAVIGATE
========================================================= */

function navigate(url) {

  const tab =
    getActiveTab();

  if (!tab) return;

  if (
    url === "chox://video"
  ) {

    openChoxVideoPage(tab.id);
    return;
  }

  tab.type = "web";
  tab.url = url;
  tab.title = url;

  tab.history =
    tab.history.slice(
      0,
      tab.historyIndex + 1
    );

  tab.history.push(url);

  tab.historyIndex =
    tab.history.length - 1;

  const page =
    document.getElementById(
      `tab-page-${tab.id}`
    );

  page.innerHTML = `
    <iframe
      class="page-frame"
      src="${escapeAttribute(url)}"
      sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-same-origin allow-scripts"
    ></iframe>
  `;

  updateTabButton(tab);
  updateAddressBar();
}


/* =========================================================
   HOME
========================================================= */

function goHome() {

  const tab =
    getActiveTab();

  if (!tab) return;

  renderHome(tab);
  switchTab(tab.id);
}


function renderHome(tab) {

  tab.type = "home";
  tab.url = "";
  tab.title = "New Tab";

  const page =
    document.getElementById(
      `tab-page-${tab.id}`
    );

  page.innerHTML = `

    <div class="home-page">

      <div class="home-container">

        <div class="logo-area">

          <div class="logo">
            LD
          </div>

          <div class="brand-name">
            Chox
          </div>

          <div class="brand-subtitle">
            Search. Browse. Watch.
          </div>

        </div>


        <div class="search-box">

          <span class="search-box-icon">
            🔍
          </span>

          <input
            id="home-search"
            type="text"
            placeholder="Search the web..."
            autocomplete="off"
            onkeydown="handleHomeSearch(event)"
          >

          <button
            class="search-button"
            onclick="performHomeSearch()"
          >
            Search
          </button>

        </div>


        <div class="quick-links-title">
          Quick access
        </div>


        <div class="quick-links">

          <button
            class="quick-link"
            onclick="openChoxVideoDesktop()"
          >
            <span class="quick-icon">
              ▶
            </span>

            <span>
              Chox Video
            </span>
          </button>


          <button
            class="quick-link"
            onclick="focusHomeSearch()"
          >
            <span class="quick-icon">
              🔎
            </span>

            <span>
              Web Search
            </span>
          </button>


          <button
            class="quick-link"
            onclick="openAddress('https://www.google.com')"
          >
            <span class="quick-icon">
              🌐
            </span>

            <span>
              Website
            </span>
          </button>

        </div>

      </div>

    </div>

  `;

  updateTabButton(tab);
  updateAddressBar();
}


/* =========================================================
   HOME SEARCH
========================================================= */

function handleHomeSearch(event) {

  if (event.key === "Enter") {
    performHomeSearch();
  }
}


function performHomeSearch() {

  const input =
    document.getElementById(
      "home-search"
    );

  if (!input) return;

  const query =
    input.value.trim();

  if (!query) return;

  const tab =
    getActiveTab();

  if (!tab) return;

  const url =
    "results.html?q=" +
    encodeURIComponent(query);

  tab.type = "search";
  tab.url = url;
  tab.title = query;

  const page =
    document.getElementById(
      `tab-page-${tab.id}`
    );

  page.innerHTML = `
    <iframe
      class="page-frame"
      src="${escapeAttribute(url)}"
    ></iframe>
  `;

  updateTabButton(tab);
  updateAddressBar();
}


function focusHomeSearch() {

  const input =
    document.getElementById(
      "home-search"
    );

  if (input) {
    input.focus();
  }
}


/* =========================================================
   CHOX VIDEO
========================================================= */

function openChoxVideoPage(tabId) {

  const tab =
    tabs.find(
      item => item.id === tabId
    );

  if (!tab) return;

  tab.type = "chox-video";
  tab.url = "chox://video";
  tab.title = "Chox Video";

  const page =
    document.getElementById(
      `tab-page-${tab.id}`
    );

  page.innerHTML = `

    <div class="chox-video-page">

      <aside class="cv-sidebar">

        <div class="cv-brand">

          <div class="cv-brand-logo">
            C
          </div>

          <span>
            Chox Video
          </span>

        </div>


        <nav class="cv-nav">

          <button
            class="cv-nav-button active"
            onclick="cvShowHome('${tab.id}')"
          >
            <span>⌂</span>
            <span>Home</span>
          </button>

          <button
            class="cv-nav-button"
            onclick="cvSearchPrompt('${tab.id}')"
          >
            <span>🔎</span>
            <span>Search</span>
          </button>

          <button
            class="cv-nav-button"
            onclick="cvShowHistory('${tab.id}')"
          >
            <span>◷</span>
            <span>History</span>
          </button>

          <button
            class="cv-nav-button"
            onclick="cvShowFavorites('${tab.id}')"
          >
            <span>★</span>
            <span>Favorites</span>
          </button>

          <button
            class="cv-nav-button"
            onclick="cvShowSubscriptions('${tab.id}')"
          >
            <span>♟</span>
            <span>Subscriptions</span>
          </button>

        </nav>

      </aside>


      <main class="cv-main">

        <div class="cv-topbar">

          <div class="cv-search">

            <input
              id="cv-search-${tab.id}"
              type="text"
              placeholder="Search videos..."
              onkeydown="cvSearchKey(event, '${tab.id}')"
            >

            <button
              onclick="cvSearch('${tab.id}')"
            >
              🔎
            </button>

          </div>

        </div>


        <div
          id="cv-content-${tab.id}"
          class="cv-content"
        ></div>

      </main>

    </div>

  `;

  updateTabButton(tab);
  updateAddressBar();

  switchTab(tab.id);

  cvShowHome(tab.id);
}


/* =========================================================
   DESKTOP CHOX VIDEO
========================================================= */

function openChoxVideoDesktop() {

  if (
    window.choxDesktop &&
    typeof window.choxDesktop.openChoxVideo ===
      "function"
  ) {

    window.choxDesktop
      .openChoxVideo("")
      .catch(console.error);

    return;
  }

  const tab =
    getActiveTab();

  if (tab) {
    openChoxVideoPage(tab.id);
  }
}


/* =========================================================
   CHOX VIDEO HOME
========================================================= */

function cvShowHome(tabId) {

  const content =
    document.getElementById(
      `cv-content-${tabId}`
    );

  if (!content) return;

  content.innerHTML = `

    <div class="cv-heading">

      <h1>
        Chox Video
      </h1>

      <p>
        Browse and watch videos with Chox.
      </p>

    </div>


    <div
      id="cv-grid-${tabId}"
      class="cv-video-grid"
    >

      <div class="cv-empty">
        Search for a video to get started.
      </div>

    </div>

  `;
}


/* =========================================================
   VIDEO SEARCH
========================================================= */

function cvSearchKey(event, tabId) {

  if (event.key === "Enter") {
    cvSearch(tabId);
  }
}


async function cvSearch(tabId) {

  const input =
    document.getElementById(
      `cv-search-${tabId}`
    );

  if (!input) return;

  const query =
    input.value.trim();

  if (!query) return;

  const content =
    document.getElementById(
      `cv-content-${tabId}`
    );

  content.innerHTML = `
    <div class="cv-empty">
      Searching...
    </div>
  `;

  try {

    const response =
      await fetch(
        "/api/search?q=" +
        encodeURIComponent(
          query + " site:youtube.com/watch"
        )
      );

    if (!response.ok) {
      throw new Error(
        "Search request failed"
      );
    }

    const data =
      await response.json();

    const results =
      data.results || [];

    const videos =
      results.filter(result =>
        getYouTubeId(result.url)
      );

    if (!videos.length) {

      content.innerHTML = `
        <div class="cv-empty">
          No videos found.
        </div>
      `;

      return;
    }

    content.innerHTML = `

      <div class="cv-heading">

        <h1>
          Search results
        </h1>

        <p>
          Results for "${escapeHtml(query)}"
        </p>

      </div>

      <div
        class="cv-video-grid"
        id="cv-grid-${tabId}"
      ></div>

    `;

    const grid =
      document.getElementById(
        `cv-grid-${tabId}`
      );

    videos.forEach(video => {

      grid.appendChild(
        createVideoCard(
          video,
          tabId
        )
      );

    });

  } catch (error) {

    console.error(error);

    content.innerHTML = `
      <div class="cv-empty">
        Unable to search right now.
      </div>
    `;
  }
}


function cvSearchPrompt(tabId) {

  const input =
    document.getElementById(
      `cv-search-${tabId}`
    );

  if (!input) return;

  input.focus();
}


/* =========================================================
   VIDEO CARD
========================================================= */

function createVideoCard(
  video,
  tabId
) {

  const card =
    document.createElement(
      "article"
    );

  card.className = "cv-card";

  const videoId =
    getYouTubeId(video.url);

  const thumbnail =
    videoId
      ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
      : "";

  card.innerHTML = `

    <img
      class="cv-thumb"
      src="${escapeAttribute(thumbnail)}"
      alt=""
      loading="lazy"
    >

    <div class="cv-card-info">

      <div class="cv-card-title">
        ${escapeHtml(
          video.title || "Untitled video"
        )}
      </div>

      <div class="cv-card-description">
        ${escapeHtml(
          stripHtml(
            video.description || ""
          )
        )}
      </div>

    </div>

  `;

  card.addEventListener(
    "click",
    () => {

      cvWatch(
        video.url,
        video.title,
        tabId
      );

    }
  );

  return card;
}


/* =========================================================
   WATCH VIDEO
========================================================= */

function cvWatch(
  url,
  title,
  tabId
) {

  const videoId =
    getYouTubeId(url);

  if (!videoId) return;

  const content =
    document.getElementById(
      `cv-content-${tabId}`
    );

  if (!content) return;

  saveVideoHistory({
    id: videoId,
    url,
    title
  });

  content.innerHTML = `

    <div class="cv-player">

      <iframe
        src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}"
        title="${escapeAttribute(title || "Video")}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>

      <div class="cv-player-title">
        ${escapeHtml(
          title || "Video"
        )}
      </div>

      <div class="cv-player-actions">

        <button
          class="cv-action"
          onclick='cvToggleFavorite(${JSON.stringify({
            id: videoId,
            url,
            title
          })})'
        >
          ★ Favorite
        </button>

        <button
          class="cv-action"
          onclick="cvShowHome('${tabId}')"
        >
          ← Back
        </button>

      </div>

    </div>

  `;
}


/* =========================================================
   YOUTUBE ID
========================================================= */

function getYouTubeId(url) {

  try {

    const parsed =
      new URL(url);

    if (
      parsed.hostname.includes(
        "youtube.com"
      )
    ) {

      return parsed.searchParams.get(
        "v"
      );

    }

    if (
      parsed.hostname ===
        "youtu.be"
    ) {

      return parsed.pathname
        .replace("/", "")
        .split("/")[0];

    }

  } catch {
    return null;
  }

  return null;
}


/* =========================================================
   VIDEO STORAGE
========================================================= */

function getVideoState() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "choxVideoState"
      ) ||
      '{"history":[],"favorites":[],"subscriptions":[]}'
    );

  } catch {

    return {
      history: [],
      favorites: [],
      subscriptions: []
    };

  }
}


function saveVideoState(state) {

  localStorage.setItem(
    "choxVideoState",
    JSON.stringify(state)
  );
}


/* =========================================================
   HISTORY
========================================================= */

function saveVideoHistory(video) {

  const state =
    getVideoState();

  state.history =
    state.history.filter(
      item =>
        item.id !== video.id
    );

  state.history.unshift(video);

  state.history =
    state.history.slice(
      0,
      100
    );

  saveVideoState(state);
}


function cvShowHistory(tabId) {

  const content =
    document.getElementById(
      `cv-content-${tabId}`
    );

  if (!content) return;

  const state =
    getVideoState();

  if (!state.history.length) {

    content.innerHTML = `
      <div class="cv-empty">
        No watch history yet.
      </div>
    `;

    return;
  }

  content.innerHTML = `

    <div class="cv-heading">

      <h1>
        History
      </h1>

    </div>

    <div
      class="cv-video-grid"
      id="cv-grid-${tabId}"
    ></div>

  `;

  const grid =
    document.getElementById(
      `cv-grid-${tabId}`
    );

  state.history.forEach(video => {

    grid.appendChild(
      createVideoCard(
        video,
        tabId
      )
    );

  });
}


/* =========================================================
   FAVORITES
========================================================= */

function cvToggleFavorite(video) {

  const state =
    getVideoState();

  const exists =
    state.favorites.some(
      item =>
        item.id === video.id
    );

  if (exists) {

    state.favorites =
      state.favorites.filter(
        item =>
          item.id !== video.id
      );

  } else {

    state.favorites.unshift(
      video
    );

  }

  saveVideoState(state);
}


function cvShowFavorites(tabId) {

  const content =
    document.getElementById(
      `cv-content-${tabId}`
    );

  if (!content) return;

  const state =
    getVideoState();

  if (!state.favorites.length) {

    content.innerHTML = `
      <div class="cv-empty">
        No favorites yet.
      </div>
    `;

    return;
  }

  content.innerHTML = `

    <div class="cv-heading">

      <h1>
        Favorites
      </h1>

    </div>

    <div
      class="cv-video-grid"
      id="cv-grid-${tabId}"
    ></div>

  `;

  const grid =
    document.getElementById(
      `cv-grid-${tabId}`
    );

  state.favorites.forEach(video => {

    grid.appendChild(
      createVideoCard(
        video,
        tabId
      )
    );

  });
}


/* =========================================================
   SUBSCRIPTIONS
========================================================= */

function cvShowSubscriptions(tabId) {

  const content =
    document.getElementById(
      `cv-content-${tabId}`
    );

  if (!content) return;

  const state =
    getVideoState();

  if (!state.subscriptions.length) {

    content.innerHTML = `
      <div class="cv-empty">
        No subscriptions yet.
      </div>
    `;

    return;
  }

  content.innerHTML = `

    <div class="cv-heading">

      <h1>
        Subscriptions
      </h1>

    </div>

    <div class="cv-video-grid">

      ${state.subscriptions
        .map(subscription => `
          <div class="cv-card">
            <div class="cv-card-info">
              <div class="cv-card-title">
                ${escapeHtml(
                  subscription.name
                )}
              </div>
            </div>
          </div>
        `)
        .join("")
      }

    </div>

  `;
}


/* =========================================================
   BACK / FORWARD
========================================================= */

function goBack() {

  const tab =
    getActiveTab();

  if (!tab) return;

  if (
    tab.historyIndex <= 0
  ) {
    return;
  }

  tab.historyIndex--;

  const url =
    tab.history[
      tab.historyIndex
    ];

  if (url) {
    loadHistoryURL(
      tab,
      url
    );
  }
}


function goForward() {

  const tab =
    getActiveTab();

  if (!tab) return;

  if (
    tab.historyIndex >=
    tab.history.length - 1
  ) {
    return;
  }

  tab.historyIndex++;

  const url =
    tab.history[
      tab.historyIndex
    ];

  if (url) {
    loadHistoryURL(
      tab,
      url
    );
  }
}


function loadHistoryURL(
  tab,
  url
) {

  if (
    url === "chox://video"
  ) {

    openChoxVideoPage(
      tab.id
    );

    return;
  }

  const page =
    document.getElementById(
      `tab-page-${tab.id}`
    );

  page.innerHTML = `
    <iframe
      class="page-frame"
      src="${escapeAttribute(url)}"
    ></iframe>
  `;

  tab.url = url;

  updateTabButton(tab);
  updateAddressBar();
}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

  const tab =
    getActiveTab();

  if (!tab) return;

  if (
    tab.type ===
    "chox-video"
  ) {

    openChoxVideoPage(
      tab.id
    );

    return;
  }

  if (
    tab.type ===
    "home"
  ) {

    renderHome(tab);
    return;
  }

  if (tab.url) {

    const page =
      document.getElementById(
        `tab-page-${tab.id}`
      );

    page.innerHTML = `
      <iframe
        class="page-frame"
        src="${escapeAttribute(tab.url)}"
      ></iframe>
    `;

  }
}


/* =========================================================
   UTILITY
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeAttribute(value) {

  return escapeHtml(value);
}


function stripHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.innerHTML = value;

  return div.textContent || "";
}


/* =========================================================
   START CHOX
========================================================= */

createNewTab();
