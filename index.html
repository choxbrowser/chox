<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home">

<header class="topbar">
    <div class="logo">
        <span class="logo-mark">C</span>
        <span>Chox</span>
    </div>
</header>

<main class="home-container">

    <div class="hero">
        <div class="big-logo">Chox</div>
        <p>Search the web your way.</p>
    </div>

    <form id="searchForm" class="search-box">

        <span class="search-icon">⌕</span>

        <input
            id="searchInput"
            type="text"
            autocomplete="off"
            placeholder="Search Chox..."
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

    <label class="safe-search">
        <input id="safeSearch" type="checkbox" checked>
        <span>Safe Search</span>
    </label>

    <div class="quick-links">
        <button data-search="Wikipedia">Wikipedia</button>
        <button data-search="YouTube">YouTube</button>
        <button data-search="GitHub">GitHub</button>
        <button data-search="Google">Google</button>
    </div>

</main>

<footer>
    Chox Search
</footer>

<script src="script.js?v=4"></script>

</body>
</html>
