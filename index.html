<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chox</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #08090c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 35px;
    border-bottom: 1px solid #1d1f25;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 23px;
    font-weight: bold;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #e00000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
}

main {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
    text-align: center;
}

.chox-title {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -5px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9699a3;
    font-size: 18px;
    margin-bottom: 35px;
}

.search-box {
    width: 100%;
    height: 58px;
    display: flex;
    background: #121419;
    border: 1px solid #292c34;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    padding: 0 20px;
    font-size: 17px;
}

.search-box button {
    border: none;
    background: #e00000;
    color: white;
    padding: 0 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.search-box button:hover {
    background: #ff1717;
}

.safe-search {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 15px;
    color: #aaaeb8;
    font-size: 14px;
}

.links-title {
    margin-top: 45px;
    margin-bottom: 18px;
    color: #d8d9de;
    font-size: 16px;
    font-weight: bold;
}

.quick-links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.site-link {
    text-decoration: none;
    color: white;
    background: #111318;
    border: 1px solid #252830;
    border-radius: 14px;
    padding: 18px 10px;
    transition: .2s;
}

.site-link:hover {
    transform: translateY(-3px);
    border-color: #e00000;
    background: #17191f;
}

.site-icon {
    font-size: 25px;
    margin-bottom: 8px;
}

.site-name {
    font-size: 14px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666a74;
    font-size: 13px;
}

@media (max-width: 650px) {
    .chox-title {
        font-size: 55px;
    }

    .quick-links {
        grid-template-columns: repeat(2, 1fr);
    }

    header {
        padding: 0 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-icon">C</div>
        <span>Chox</span>
    </div>
</header>

<main>

    <div class="chox-title">Chox</div>

    <div class="subtitle">
        Search the web your way.
    </div>

    <form id="searchForm" class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="Search Chox..."
            autocomplete="off"
            required
        >

        <button type="submit">
            Search
        </button>
    </form>

    <label class="safe-search">
        <input id="safeSearch" type="checkbox" checked>
        Safe Search
    </label>

    <div class="links-title">
        Quick Links
    </div>

    <div class="quick-links">

        <a class="site-link" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">▶</div>
            <div class="site-name">YouTube</div>
        </a>

        <a class="site-link" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">f</div>
            <div class="site-name">Facebook</div>
        </a>

        <a class="site-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">◎</div>
            <div class="site-name">Instagram</div>
        </a>

        <a class="site-link" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">♪</div>
            <div class="site-name">TikTok</div>
        </a>

        <a class="site-link" href="https://www.reddit.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">●</div>
            <div class="site-name">Reddit</div>
        </a>

        <a class="site-link" href="https://discord.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">☁</div>
            <div class="site-name">Discord</div>
        </a>

        <a class="site-link" href="https://github.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">◉</div>
            <div class="site-name">GitHub</div>
        </a>

        <a class="site-link" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
            <div class="site-icon">G</div>
            <div class="site-name">Google</div>
        </a>

    </div>

</main>

<footer>
    Chox Search
</footer>

<script>
const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const query = input.value.trim();

    if (!query) {
        input.focus();
        return;
    }

    window.location.href =
        "results.html?q=" + encodeURIComponent(query);
});
</script>

</body>
</html>
