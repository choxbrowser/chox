<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chox Browser</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #101010;
            color: #fff;
        }

        button,
        input {
            font: inherit;
        }

        /* =========================
           MAIN APP
        ========================= */

        #app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        /* =========================
           TAB BAR
        ========================= */

        .tab-bar {
            height: 48px;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 8px 0;
            background: #171717;
            border-bottom: 1px solid #292929;
        }

        .tabs {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            position: relative;
            flex: 0 1 220px;
            min-width: 130px;
            max-width: 240px;
            height: 38px;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 0 8px 0 14px;

            border-radius: 10px 10px 0 0;
            background: #202020;
            color: #aaa;

            cursor: pointer;
            user-select: none;

            transform: translateX(0);
            opacity: 1;

            transition:
                transform 280ms cubic-bezier(.2,.8,.2,1),
                opacity 180ms ease,
                background 160ms ease,
                color 160ms ease;
        }

        .tab:hover {
            background: #292929;
            color: #ddd;
        }

        .tab.active {
            background: #2b2b2b;
            color: #fff;
        }

        .tab-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .tab-close {
            width: 25px;
            height: 25px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 6px;

            background: transparent;
            color: #888;

            cursor: pointer;
            font-size: 17px;

            transition:
                background 140ms ease,
                color 140ms ease;
        }

        .tab-close:hover {
            background: rgba(255,255,255,.1);
            color: white;
        }

        .new-tab {
            width: 38px;
            height: 34px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 2px;

            border: 0;
            border-radius: 9px;

            background: transparent;
            color: #aaa;

            cursor: pointer;
            font-size: 24px;
            line-height: 1;

            transition:
                background 150ms ease,
                color 150ms ease,
                transform 150ms ease;
        }

        .new-tab:hover {
            background: #292929;
            color: white;
        }

        .new-tab:active {
            transform: scale(.9);
        }

        .tab-moving {
            transition:
                transform 280ms cubic-bezier(.2,.8,.2,1);
        }

        .tab-closing {
            opacity: 0;
            transform: scale(.92);
            transition:
                opacity 180ms ease,
                transform 180ms ease;
        }

        .tab-opening {
            opacity: 0;
            transform: translateX(12px) scale(.97);
        }

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {
            height: 52px;
            min-height: 52px;

            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 10px;

            background: #1b1b1b;
            border-bottom: 1px solid #292929;
        }

        .nav-button {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 9px;

            background: transparent;
            color: #aaa;

            cursor: pointer;
            font-size: 18px;

            transition:
                background 150ms ease,
                color 150ms ease;
        }

        .nav-button:hover {
            background: #292929;
            color: white;
        }

        .address-container {
            flex: 1;
            height: 36px;

            display: flex;
            align-items: center;

            padding: 0 14px;

            border-radius: 10px;

            background: #252525;
            border: 1px solid #303030;

            transition:
                border-color 150ms ease,
                background 150ms ease;
        }

        .address-container:focus-within {
            background: #202020;
            border-color: #555;
        }

        #addressBar {
            width: 100%;
            height: 100%;

            border: 0;
            outline: 0;

            background: transparent;
            color: white;

            font-size: 14px;
        }

        #addressBar::placeholder {
            color: #777;
        }

        /* =========================
           PAGE AREA
        ========================= */

        #pages {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #111;
        }

        .tab-page {
            position: absolute;
            inset: 0;

            display: none;

            overflow: auto;

            background: #111;
        }

        .tab-page.active {
            display: block;
        }

        /* =========================
           HOME PAGE
        ========================= */

        .home {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 70px 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 12px;
        }

        .logo-circle {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 3px solid #fff;
            border-radius: 50%;

            font-size: 22px;
            font-weight: 800;
        }

        .logo-text {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .home-subtitle {
            margin-bottom: 30px;
            color: #777;
            font-size: 14px;
        }

        .search-box {
            width: min(700px, 90%);
            height: 52px;

            display: flex;
            align-items: center;

            padding: 0 8px 0 18px;

            border: 1px solid #333;
            border-radius: 15px;

            background: #1c1c1c;

            transition:
                border-color 160ms ease,
                box-shadow 160ms ease;
        }

        .search-box:focus-within {
            border-color: #555;
            box-shadow: 0 0 0 3px rgba(255,255,255,.04);
        }

        .search-box input {
            flex: 1;

            border: 0;
            outline: 0;

            background: transparent;
            color: white;

            font-size: 15px;
        }

        .search-button {
            width: 40px;
            height: 40px;

            border: 0;
            border-radius: 11px;

            background: #fff;
            color: #111;

            cursor: pointer;
            font-size: 17px;
        }

        .quick-links {
            width: min(850px, 95%);

            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(145px, 1fr)
            );

            gap: 12px;

            margin-top: 35px;
        }

        .quick-link {
            min-height: 100px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 9px;

            border: 1px solid #292929;
            border-radius: 15px;

            background: #191919;
            color: #ddd;

            cursor: pointer;

            transition:
                transform 160ms ease,
                background 160ms ease,
                border-color 160ms ease;
        }

        .quick-link:hover {
            transform: translateY(-2px);
            background: #222;
            border-color: #3a3a3a;
        }

        .quick-icon {
            font-size: 25px;
        }

        /* =========================
           CHOX VIDEO
        ========================= */

        .video-app {
            min-height: 100%;
            display: flex;
            background: #111;
        }

        .video-sidebar {
            width: 210px;
            flex-shrink: 0;

            padding: 20px 12px;

            background: #161616;
            border-right: 1px solid #292929;
        }

        .video-brand {
            padding: 8px 12px 20px;

            font-size: 20px;
            font-weight: 800;
        }

        .video-nav {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px 12px;

            border: 0;
            border-radius: 9px;

            background: transparent;
            color: #aaa;

            cursor: pointer;
            text-align: left;

            transition:
                background 150ms ease,
                color 150ms ease;
        }

        .video-nav:hover,
        .video-nav.active {
            background: #272727;
            color: white;
        }

        .video-content {
            flex: 1;
            min-width: 0;

            padding: 25px;
            overflow: auto;
        }

        .video-heading {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .video-description {
            margin: 0 0 22px;
            color: #777;
        }

        .video-search {
            width: min(700px, 100%);
            height: 45px;

            display: flex;

            margin-bottom: 25px;
        }

        .video-search input {
            flex: 1;

            padding: 0 14px;

            border: 1px solid #333;
            border-radius: 9px 0 0 9px;

            outline: 0;

            background: #1c1c1c;
            color: white;
        }

        .video-search button {
            width: 55px;

            border: 0;
            border-radius: 0 9px 9px 0;

            background: white;
            color: #111;

            cursor: pointer;
        }

        .video-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(240px, 1fr));

            gap: 20px;
        }

        .video-card {
            overflow: hidden;

            border: 1px solid #292929;
            border-radius: 12px;

            background: #181818;

            cursor: pointer;

            transition:
                transform 160ms ease,
                border-color 160ms ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            border-color: #444;
        }

        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #222;

            color: #888;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-card-body {
            padding: 13px;
        }

        .video-card-title {
            display: -webkit-box;

            overflow: hidden;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            font-size: 14px;
            line-height: 1.4;
        }

        /* =========================
           VIDEO PLAYER
        ========================= */

        .video-player-page {
            padding: 25px;
        }

        .video-player {
            width: min(100%, 1000px);
            margin: 0 auto;
        }

        .video-player iframe {
            width: 100%;
            aspect-ratio: 16 / 9;

            border: 0;
            border-radius: 12px;

            background: black;
        }

        .player-title {
            margin-top: 18px;
            font-size: 22px;
            font-weight: 700;
        }

        .back-button {
            margin-bottom: 15px;

            padding: 9px 13px;

            border: 0;
            border-radius: 8px;

            background: #252525;
            color: #ddd;

            cursor: pointer;
        }

        .back-button:hover {
            background: #303030;
        }

        /* =========================
           IFRAME PAGES
        ========================= */

        .browser-frame {
            width: 100%;
            height: 100%;

            border: 0;

            background: white;
        }

        /* =========================
           EMPTY / MESSAGE
        ========================= */

        .empty-state {
            padding: 50px 20px;

            text-align: center;
            color: #666;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {
            .tab {
                min-width: 115px;
                max-width: 180px;
            }

            .video-sidebar {
                width: 65px;
            }

            .video-brand {
                font-size: 0;
                text-align: center;
            }

            .video-nav {
                justify-content: center;
            }

            .video-nav span:last-child {
                display: none;
            }

            .video-content {
                padding: 15px;
            }

            .home {
                padding-top: 40px;
            }

            .logo-text {
                font-size: 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tab,
            .tab-moving,
            .tab-closing,
            .tab-opening {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- =========================
         TABS
    ========================= -->

    <div class="tab-bar">

        <div
            class="tabs"
            id="tabs"
        ></div>

        <button
            class="new-tab"
            id="newTabButton"
            title="New tab"
            type="button"
        >+</button>

    </div>

    <!-- =========================
         TOOLBAR
    ========================= -->

    <div class="toolbar">

        <button
            class="nav-button"
            onclick="goBack()"
            title="Back"
            type="button"
        >←</button>

        <button
            class="nav-button"
            onclick="goForward()"
            title="Forward"
            type="button"
        >→</button>

        <button
            class="nav-button"
            onclick="reloadPage()"
            title="Reload"
            type="button"
        >↻</button>

        <button
            class="nav-button"
            onclick="goHome()"
            title="Home"
            type="button"
        >⌂</button>

        <div class="address-container">

            <input
                id="addressBar"
                type="text"
                placeholder="Search or enter address"
                autocomplete="off"
                spellcheck="false"
            >

        </div>

    </div>

    <!-- =========================
         PAGES
    ========================= -->

    <div id="pages"></div>

</div>


<script>

/* =========================================================
   CHOX BROWSER
========================================================= */

let tabs = [];
let activeTabId = null;


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    const newTabButton =
        document.getElementById("newTabButton");

    newTabButton.addEventListener(
        "click",
        createNewTab
    );

    const addressBar =
        document.getElementById("addressBar");

    addressBar.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                navigateAddress();
            }

        }
    );

    createNewTab();

});


/* =========================================================
   CREATE NEW TAB
========================================================= */

function createNewTab() {

    const id =
        "tab-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 7);

    const tab = {

        id: id,

        title: "New Tab",

        url: "chox://home",

        type: "home",

        history: [
            "chox://home"
        ],

        historyIndex: 0

    };

    tabs.push(tab);


    /* CREATE TAB BUTTON */

    const tabButton =
        document.createElement("div");

    tabButton.className =
        "tab tab-opening";

    tabButton.id =
        id + "-button";

    tabButton.innerHTML = `

        <span class="tab-title">
            New Tab
        </span>

        <button
            class="tab-close"
            type="button"
            title="Close tab"
        >×</button>

    `;


    const closeButton =
        tabButton.querySelector(
            ".tab-close"
        );


    closeButton.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            closeTab(id);

        }
    );


    tabButton.addEventListener(
        "click",
        () => {

            switchTab(id);

        }
    );


    const tabsContainer =
        document.getElementById("tabs");

    tabsContainer.appendChild(
        tabButton
    );


    /* CREATE PAGE */

    const page =
        document.createElement("div");

    page.className =
        "tab-page";

    page.id =
        id + "-page";

    document
        .getElementById("pages")
        .appendChild(page);


    /* RENDER HOME */

    renderHome(tab);


    /* SWITCH TO TAB */

    switchTab(id);


    /* OPENING ANIMATION */

    requestAnimationFrame(() => {

        tabButton.classList.remove(
            "tab-opening"
        );

    });

}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(id) {

    if (tabs.length <= 1) {

        return;

    }


    const button =
        document.getElementById(
            id + "-button"
        );

    const page =
        document.getElementById(
            id + "-page"
        );


    /*
       Save old positions
       for smooth FLIP animation.
    */

    const oldPositions =
        new Map();

    document
        .querySelectorAll(".tab")
        .forEach(element => {

            oldPositions.set(
                element.id,
                element.getBoundingClientRect().left
            );

        });


    const index =
        tabs.findIndex(
            tab => tab.id === id
        );


    const wasActive =
        activeTabId === id;


    tabs.splice(index, 1);


    /* CLOSE ANIMATION */

    if (button) {

        button.classList.add(
            "tab-closing"
        );

    }


    setTimeout(() => {

        if (button) {
            button.remove();
        }

        if (page) {
            page.remove();
        }


        /*
           Move remaining tabs smoothly
        */

        document
            .querySelectorAll(".tab")
            .forEach(element => {

                const oldLeft =
                    oldPositions.get(
                        element.id
                    );

                if (
                    oldLeft === undefined
                ) {
                    return;
                }


                const newLeft =
                    element
                        .getBoundingClientRect()
                        .left;


                const distance =
                    oldLeft - newLeft;


                if (
                    Math.abs(distance) > 1
                ) {

                    element.style.transform =
                        `translateX(${distance}px)`;

                    element.classList.add(
                        "tab-moving"
                    );


                    requestAnimationFrame(() => {

                        element.style.transform =
                            "";

                    });


                    setTimeout(() => {

                        element.classList.remove(
                            "tab-moving"
                        );

                    }, 300);

                }

            });

    }, 180);


    /* SELECT ANOTHER TAB */

    if (wasActive) {

        const newIndex =
            Math.min(
                index,
                tabs.length - 1
            );


        const nextTab =
            tabs[newIndex];


        if (nextTab) {

            switchTab(
                nextTab.id
            );

        }

    }

}


/* =========================================================
   SWITCH TAB
========================================================= */

function switchTab(id) {

    const tab =
        tabs.find(
            item => item.id === id
        );


    if (!tab) {
        return;
    }


    activeTabId = id;


    /* HIDE ALL PAGES */

    document
        .querySelectorAll(".tab-page")
        .forEach(page => {

            page.classList.remove(
                "active"
            );

        });


    /* DEACTIVATE ALL TABS */

    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    /* ACTIVATE PAGE */

    const page =
        document.getElementById(
            id + "-page"
        );


    if (page) {

        page.classList.add(
            "active"
        );

    }


    /* ACTIVATE TAB BUTTON */

    const button =
        document.getElementById(
            id + "-button"
        );


    if (button) {

        button.classList.add(
            "active"
        );

    }


    updateAddressBar();

}


/* =========================================================
   UPDATE TAB BUTTON
========================================================= */

function updateTabButton(tab) {

    const button =
        document.getElementById(
            tab.id + "-button"
        );


    if (!button) {
        return;
    }


    const title =
        button.querySelector(
            ".tab-title"
        );


    if (title) {

        title.textContent =
            tab.title || "New Tab";

    }

}


/* =========================================================
   UPDATE ADDRESS BAR
========================================================= */

function updateAddressBar() {

    const addressBar =
        document.getElementById(
            "addressBar"
        );


    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    addressBar.value =
        tab.url === "chox://home" ||
        tab.url === "chox://video"

            ? ""

            : tab.url;

}


/* =========================================================
   HOME PAGE
========================================================= */

function renderHome(tab) {

    const page =
        document.getElementById(
            tab.id + "-page"
        );


    if (!page) {
        return;
    }


    page.innerHTML = `

        <div class="home">

            <div class="logo">

                <div class="logo-circle">
                    C
                </div>

                <div class="logo-text">
                    Chox
                </div>

            </div>

            <div class="home-subtitle">
                Fast. Simple. Yours.
            </div>


            <div class="search-box">

                <input
                    id="home-search-${tab.id}"
                    type="text"
                    placeholder="Search Chox..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    onclick="homeSearch('${tab.id}')"
                >⌕</button>

            </div>


            <div class="quick-links">

                <button
                    class="quick-link"
                    type="button"
                    onclick="openChoxVideoPage('${tab.id}')"
                >

                    <span class="quick-icon">
                        ▶
                    </span>

                    <span>
                        Chox Video
                    </span>

                </button>


                <button
                    class="quick-link"
                    type="button"
                    onclick="focusAddressBar()"
                >

                    <span class="quick-icon">
                        🔍
                    </span>

                    <span>
                        Search
                    </span>

                </button>


                <button
                    class="quick-link"
                    type="button"
                    onclick="createNewTab()"
                >

                    <span class="quick-icon">
                        ＋
                    </span>

                    <span>
                        New Tab
                    </span>

                </button>

            </div>

        </div>

    `;


    const searchInput =
        document.getElementById(
            "home-search-" + tab.id
        );


    if (searchInput) {

        searchInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    homeSearch(
                        tab.id
                    );

                }

            }
        );

    }

}


/* =========================================================
   HOME SEARCH
========================================================= */

function homeSearch(tabId) {

    const input =
        document.getElementById(
            "home-search-" + tabId
        );


    if (!input) {
        return;
    }


    const query =
        input.value.trim();


    if (!query) {
        return;
    }


    navigateToSearch(
        tabId,
        query
    );

}


/* =========================================================
   SEARCH
========================================================= */

function navigateToSearch(
    tabId,
    query
) {

    const tab =
        tabs.find(
            item => item.id === tabId
        );


    if (!tab) {
        return;
    }


    const encoded =
        encodeURIComponent(
            query
        );


    tab.url =
        "results.html?q=" +
        encoded;

    tab.type =
        "search";

    tab.title =
        "Search: " + query;


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    page.innerHTML = `

        <iframe
            class="browser-frame"
            src="results.html?q=${encoded}"
        ></iframe>

    `;


    updateTabButton(tab);

    switchTab(tab.id);

}


/* =========================================================
   CHOX VIDEO
========================================================= */

function openChoxVideoPage(tabId) {

    const tab =
        tabs.find(
            item => item.id === tabId
        );


    if (!tab) {
        return;
    }


    tab.type =
        "chox-video";

    tab.url =
        "chox://video";

    tab.title =
        "Chox Video";


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    page.innerHTML = `

        <div class="video-app">

            <aside class="video-sidebar">

                <div class="video-brand">
                    Chox Video
                </div>

                <button
                    class="video-nav active"
                    onclick="showVideoHome('${tab.id}')"
                >
                    🏠
                    <span>Home</span>
                </button>

                <button
                    class="video-nav"
                    onclick="focusVideoSearch('${tab.id}')"
                >
                    🔍
                    <span>Search</span>
                </button>

                <button
                    class="video-nav"
                    onclick="showVideoMessage('${tab.id}', 'History')"
                >
                    🕘
                    <span>History</span>
                </button>

                <button
                    class="video-nav"
                    onclick="showVideoMessage('${tab.id}', 'Favorites')"
                >
                    ★
                    <span>Favorites</span>
                </button>

                <button
                    class="video-nav"
                    onclick="showVideoMessage('${tab.id}', 'Subscriptions')"
                >
                    ♥
                    <span>Subscriptions</span>
                </button>

            </aside>


            <main class="video-content">

                <h1 class="video-heading">
                    Chox Video
                </h1>

                <p class="video-description">
                    Search and watch supported videos through Chox.
                </p>


                <div class="video-search">

                    <input
                        id="video-search-${tab.id}"
                        type="text"
                        placeholder="Search videos..."
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        onclick="searchVideos('${tab.id}')"
                    >⌕</button>

                </div>


                <div
                    id="video-results-${tab.id}"
                    class="video-grid"
                >

                    <div class="empty-state">
                        Search for a video to get started.
                    </div>

                </div>

            </main>

        </div>

    `;


    const searchInput =
        document.getElementById(
            "video-search-" + tab.id
        );


    if (searchInput) {

        searchInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    searchVideos(
                        tab.id
                    );

                }

            }
        );

    }


    updateTabButton(tab);

    switchTab(tab.id);

}


/* =========================================================
   VIDEO HOME
========================================================= */

function showVideoHome(tabId) {

    openChoxVideoPage(
        tabId
    );

}


/* =========================================================
   VIDEO SEARCH
========================================================= */

async function searchVideos(tabId) {

    const input =
        document.getElementById(
            "video-search-" + tabId
        );


    const results =
        document.getElementById(
            "video-results-" + tabId
        );


    if (!input || !results) {
        return;
    }


    const query =
        input.value.trim();


    if (!query) {
        return;
    }


    results.innerHTML = `

        <div class="empty-state">
            Searching...
        </div>

    `;


    try {

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    query
                )
            );


        if (!response.ok) {
            throw new Error(
                "Search failed"
            );
        }


        const data =
            await response.json();


        const items =
            Array.isArray(data)
                ? data
                : (
                    data.results ||
                    data.web ||
                    []
                );


        const videoItems =
            items.filter(item => {

                const url =
                    item.url ||
                    item.link ||
                    "";


                return (
                    url.includes(
                        "youtube.com/watch"
                    ) ||
                    url.includes(
                        "youtu.be/"
                    )
                );

            });


        if (!videoItems.length) {

            results.innerHTML = `

                <div class="empty-state">
                    No supported videos found.
                </div>

            `;

            return;

        }


        results.innerHTML =
            videoItems
                .map(item => {

                    const url =
                        item.url ||
                        item.link ||
                        "";


                    const title =
                        item.title ||
                        "Video";


                    const videoId =
                        getYouTubeId(
                            url
                        );


                    const thumbnail =
                        videoId
                            ? `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
                            : "";


                    return `

                        <div
                            class="video-card"
                            onclick="watchVideo('${escapeHtml(videoId || "")}', '${escapeHtml(title)}')"
                        >

                            <div class="video-thumbnail">

                                ${
                                    thumbnail

                                    ? `
                                        <img
                                            src="${thumbnail}"
                                            alt=""
                                        >
                                      `

                                    : "▶"
                                }

                            </div>

                            <div class="video-card-body">

                                <div class="video-card-title">
                                    ${escapeHtml(title)}
                                </div>

                            </div>

                        </div>

                    `;

                })
                .join("");


    } catch (error) {

        console.error(error);


        results.innerHTML = `

            <div class="empty-state">
                Search is unavailable right now.
            </div>

        `;

    }

}


/* =========================================================
   WATCH VIDEO
========================================================= */

function watchVideo(
    videoId,
    title
) {

    if (!videoId) {
        return;
    }


    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    tab.type =
        "video-player";

    tab.title =
        title || "Video";

    tab.url =
        "https://www.youtube.com/watch?v=" +
        videoId;


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    page.innerHTML = `

        <div class="video-player-page">

            <button
                class="back-button"
                onclick="openChoxVideoPage('${tab.id}')"
            >
                ← Back to Chox Video
            </button>


            <div class="video-player">

                <iframe
                    src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen
                ></iframe>


                <div class="player-title">
                    ${escapeHtml(title || "Video")}
                </div>

            </div>

        </div>

    `;


    updateTabButton(tab);

    updateAddressBar();

}


/* =========================================================
   YOUTUBE ID
========================================================= */

function getYouTubeId(url) {

    if (!url) {
        return null;
    }


    try {

        const parsed =
            new URL(url);


        if (
            parsed.hostname.includes(
                "youtube.com"
            )
        ) {

            return parsed.searchParams.get(
                "v"
            );

        }


        if (
            parsed.hostname.includes(
                "youtu.be"
            )
        ) {

            return parsed.pathname
                .replace("/", "");

        }

    } catch (error) {

        return null;

    }


    return null;

}


/* =========================================================
   ADDRESS NAVIGATION
========================================================= */

function navigateAddress() {

    const addressBar =
        document.getElementById(
            "addressBar"
        );


    const value =
        addressBar.value.trim();


    if (!value) {
        return;
    }


    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    if (
        value === "chox://home"
    ) {

        goHome();

        return;

    }


    if (
        value === "chox://video"
    ) {

        openChoxVideoPage(
            tab.id
        );

        return;

    }


    let url =
        value;


    if (
        !/^https?:\/\//i.test(
            url
        )
    ) {

        if (
            url.includes(".") &&
            !url.includes(" ")
        ) {

            url =
                "https://" +
                url;

        } else {

            navigateToSearch(
                tab.id,
                value
            );

            return;

        }

    }


    openWebsite(
        tab.id,
        url
    );

}


/* =========================================================
   OPEN WEBSITE
========================================================= */

function openWebsite(
    tabId,
    url
) {

    const tab =
        tabs.find(
            item => item.id === tabId
        );


    if (!tab) {
        return;
    }


    tab.url =
        url;

    tab.type =
        "website";

    tab.title =
        url;


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    page.innerHTML = `

        <iframe
            class="browser-frame"
            src="${escapeHtml(url)}"
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
        ></iframe>

    `;


    updateTabButton(tab);

    updateAddressBar();

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    tab.url =
        "chox://home";

    tab.type =
        "home";

    tab.title =
        "New Tab";


    renderHome(tab);

    updateTabButton(tab);

    updateAddressBar();

}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    if (
        tab.type === "home"
    ) {

        renderHome(tab);

        return;

    }


    if (
        tab.type === "chox-video"
    ) {

        openChoxVideoPage(
            tab.id
        );

        return;

    }


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    const iframe =
        page?.querySelector(
            "iframe"
        );


    if (iframe) {

        iframe.src =
            iframe.src;

    }

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    const iframe =
        page?.querySelector(
            "iframe"
        );


    if (iframe) {

        try {

            iframe.contentWindow.history.back();

        } catch (error) {

            console.log(
                "Unable to navigate iframe history."
            );

        }

    }

}


/* =========================================================
   FORWARD
========================================================= */

function goForward() {

    const tab =
        tabs.find(
            item =>
                item.id === activeTabId
        );


    if (!tab) {
        return;
    }


    const page =
        document.getElementById(
            tab.id + "-page"
        );


    const iframe =
        page?.querySelector(
            "iframe"
        );


    if (iframe) {

        try {

            iframe.contentWindow.history.forward();

        } catch (error) {

            console.log(
                "Unable to navigate iframe history."
            );

        }

    }

}


/* =========================================================
   ADDRESS BAR FOCUS
========================================================= */

function focusAddressBar() {

    const addressBar =
        document.getElementById(
            "addressBar"
        );


    addressBar.focus();

    addressBar.select();

}


/* =========================================================
   VIDEO SEARCH FOCUS
========================================================= */

function focusVideoSearch(tabId) {

    const input =
        document.getElementById(
            "video-search-" + tabId
        );


    if (input) {

        input.focus();

    }

}


/* =========================================================
   VIDEO MESSAGE
========================================================= */

function showVideoMessage(
    tabId,
    name
) {

    const results =
        document.getElementById(
            "video-results-" + tabId
        );


    if (!results) {
        return;
    }


    results.innerHTML = `

        <div class="empty-state">

            <h2>
                ${escapeHtml(name)}
            </h2>

            <p>
                This section is ready for local Chox Video data.
            </p>

        </div>

    `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
           Ctrl + T
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "t"
        ) {

            event.preventDefault();

            createNewTab();

        }


        /*
           Ctrl + W
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "w"
        ) {

            event.preventDefault();

            if (activeTabId) {

                closeTab(
                    activeTabId
                );

            }

        }


        /*
           Ctrl + L
        */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "l"
        ) {

            event.preventDefault();

            focusAddressBar();

        }

    }
);

</script>
