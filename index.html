<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chox</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #08090c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* HEADER */

.topbar {
    height: 70px;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: #08090c;
    border-bottom: 1px solid #202228;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 22px;
    font-weight: 700;
}

.brand-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #e00000;
    border-radius: 50%;

    font-weight: 900;
}

/* BROWSER CONTROLS */

.browser-controls {
    display: flex;
    gap: 8px;
}

.browser-button {
    border: 1px solid #292c34;
    background: #121419;
    color: white;

    border-radius: 10px;

    padding: 9px 13px;

    cursor: pointer;

    font-size: 14px;
}

.browser-button:hover {
    background: #1c1f26;
}

/* HOME */

#homeView {
    width: 100%;
}

.home {
    width: 100%;
    max-width: 900px;

    margin: auto;

    padding: 60px 20px;

    text-align: center;
}

.chox-logo {
    font-size: 76px;
    font-weight: 900;

    letter-spacing: -6px;

    margin: 0;
}

.subtitle {
    color: #9699a3;

    font-size: 18px;

    margin-top: 8px;
    margin-bottom: 35px;
}

/* SEARCH */

.search-form {
    width: 100%;
    height: 60px;

    display: flex;

    background: #121419;

    border: 1px solid #2a2d35;

    border-radius: 18px;

    overflow: hidden;
}

.search-input {
    flex: 1;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    padding: 0 20px;

    font-size: 17px;
}

.search-input::placeholder {
    color: #777b85;
}

.search-button {
    border: 0;

    background: #e00000;
    color: white;

    padding: 0 28px;

    font-weight: bold;

    cursor: pointer;
}

.search-button:hover {
    background: #ff1717;
}

/* SAFE SEARCH */

.safe-search {
    margin-top: 15px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    color: #a5a8b1;

    font-size: 14px;
}

/* QUICK LINKS */

.quick-title {
    margin-top: 45px;
    margin-bottom: 18px;

    font-weight: bold;

    color: #d8d9de;
}

.quick-links {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 12px;
}

.site-link {
    min-height: 105px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 8px;

    text-decoration: none;

    color: white;

    background: #111318;

    border: 1px solid #252830;

    border-radius: 15px;

    cursor: pointer;

    transition: 0.2s;
}

.site-link:hover {
    transform: translateY(-3px);

    background: #17191f;

    border-color: #e00000;
}

.site-icon {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #20232a;

    border-radius: 10px;

    font-size: 21px;

    font-weight: bold;
}

.site-name {
    font-size: 14px;
    font-weight: bold;
}

/* WEBSITE VIEW */

#browserView {
    display: none;

    width: 100%;
    height: calc(100vh - 70px);
}

#websiteFrame {
    width: 100%;
    height: 100%;

    border: 0;

    background: white;
}

/* BLOCKED WEBSITE MESSAGE */

#blockedMessage {
    display: none;

    width: 100%;
    height: 100%;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

.blocked-box {
    max-width: 500px;

    background: #111318;

    border: 1px solid #292c34;

    border-radius: 20px;

    padding: 35px;
}

.blocked-box h2 {
    margin-top: 0;
}

.blocked-box p {
    color: #9699a3;

    line-height: 1.6;
}

.open-button {
    display: inline-block;

    margin-top: 15px;

    padding: 12px 20px;

    background: #e00000;

    color: white;

    text-decoration: none;

    border-radius: 10px;

    font-weight: bold;
}

/* FOOTER */

.footer {
    text-align: center;

    color: #666a74;

    padding: 25px;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .chox-logo {
        font-size: 58px;
    }

    .quick-links {
        grid-template-columns: repeat(2, 1fr);
    }

    .home {
        padding: 40px 15px;
    }

    .browser-controls {
        gap: 4px;
    }

    .browser-button {
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            C
        </div>

        <span>
            Chox
        </span>

    </div>

    <div class="browser-controls">

        <button
            class="browser-button"
            onclick="goBack()"
        >
            ←
        </button>

        <button
            class="browser-button"
            onclick="goHome()"
        >
            Home
        </button>

    </div>

</header>


<!-- HOME VIEW -->

<div id="homeView">

    <main class="home">

        <h1 class="chox-logo">
            Chox
        </h1>

        <div class="subtitle">
            Search the web your way.
        </div>


        <!-- SEARCH -->

        <form
            id="searchForm"
            class="search-form"
        >

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Search Chox..."
                autocomplete="off"
                required
            >

            <button
                class="search-button"
                type="submit"
            >
                Search
            </button>

        </form>


        <!-- SAFE SEARCH -->

        <label class="safe-search">

            <input
                id="safeSearch"
                type="checkbox"
                checked
            >

            <span>
                Safe Search
            </span>

        </label>


        <!-- QUICK LINKS -->

        <div class="quick-title">
            Quick Links
        </div>

        <div class="quick-links">


            <a
                class="site-link"
                href="https://www.youtube.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    ▶
                </div>

                <div class="site-name">
                    YouTube
                </div>
            </a>


            <a
                class="site-link"
                href="https://www.facebook.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    f
                </div>

                <div class="site-name">
                    Facebook
                </div>
            </a>


            <a
                class="site-link"
                href="https://www.instagram.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    ◎
                </div>

                <div class="site-name">
                    Instagram
                </div>
            </a>


            <a
                class="site-link"
                href="https://www.tiktok.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    ♪
                </div>

                <div class="site-name">
                    TikTok
                </div>
            </a>


            <a
                class="site-link"
                href="https://www.reddit.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    ●
                </div>

                <div class="site-name">
                    Reddit
                </div>
            </a>


            <a
                class="site-link"
                href="https://discord.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    ☁
                </div>

                <div class="site-name">
                    Discord
                </div>
            </a>


            <a
                class="site-link"
                href="https://github.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    ◉
                </div>

                <div class="site-name">
                    GitHub
                </div>
            </a>


            <a
                class="site-link"
                href="https://www.google.com/"
                onclick="openSite(event, this.href)"
            >
                <div class="site-icon">
                    G
                </div>

                <div class="site-name">
                    Google
                </div>
            </a>

        </div>

    </main>


    <footer class="footer">
        Chox Search
    </footer>

</div>


<!-- BROWSER VIEW -->

<div id="browserView">

    <iframe
        id="websiteFrame"
        src=""
        title="Chox Browser"
    ></iframe>


    <div id="blockedMessage">

        <div class="blocked-box">

            <h2>
                This website can't be embedded
            </h2>

            <p>
                This website doesn't allow other websites
                to display it inside an embedded frame.
            </p>

            <a
                id="openExternal"
                class="open-button"
                href="#"
            >
                Open Website
            </a>

        </div>

    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const homeView =
    document.getElementById("homeView");

const browserView =
    document.getElementById("browserView");

const websiteFrame =
    document.getElementById("websiteFrame");

const blockedMessage =
    document.getElementById("blockedMessage");

const openExternal =
    document.getElementById("openExternal");

const searchForm =
    document.getElementById("searchForm");

const searchInput =
    document.getElementById("searchInput");


/* =========================
   OPEN WEBSITE
========================= */

function openSite(event, url) {

    event.preventDefault();

    homeView.style.display = "none";

    browserView.style.display = "block";

    websiteFrame.style.display = "block";

    blockedMessage.style.display = "none";

    websiteFrame.src = url;

    openExternal.href = url;

}


/* =========================
   HOME
========================= */

function goHome() {

    browserView.style.display = "none";

    homeView.style.display = "block";

    websiteFrame.src = "";

}


/* =========================
   BACK
========================= */

function goBack() {

    /*
     * Try to go back inside the iframe.
     */

    try {

        websiteFrame.contentWindow.history.back();

    } catch (error) {

        goHome();

    }

}


/* =========================
   SEARCH
========================= */

searchForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const query =
            searchInput.value.trim();

        if (!query) {

            searchInput.focus();

            return;

        }

        /*
         * Keep your existing Chox
         * results page.
         */

        window.location.href =
            "results.html?q=" +
            encodeURIComponent(query);

    }
);


/* =========================
   IFRAME ERROR HANDLING
========================= */

websiteFrame.addEventListener(
    "load",
    function() {

        /*
         * Some websites block iframe
         * embedding. Browsers don't always
         * expose the error directly, so the
         * fallback message is provided by
         * the browser/site when necessary.
         */

    }
);

</script>

</body>
</html>
