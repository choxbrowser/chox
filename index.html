<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chox Browser</title>

    <meta
        name="description"
        content="Chox - Fast, private and customizable browser"
    >

    <style>
        :root {
            --bg: #050505;
            --bg2: #0a0a0a;
            --panel: #101010;
            --panel2: #151515;
            --panel3: #1b1b1b;

            --red: #e00000;
            --red2: #ff2020;
            --red3: #8b0000;

            --text: #f5f5f5;
            --muted: #8d8d8d;
            --border: #292929;

            --shadow:
                0 0 20px rgba(220, 0, 0, 0.10);

            --glow:
                0 0 18px rgba(255, 0, 0, 0.20);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(120, 0, 0, 0.14),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #080808 0%,
                    #030303 100%
                );

            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            color: inherit;
        }

        /* =========================
           APP
        ========================= */

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           TAB BAR
        ========================= */

        #tabBar {
            height: 48px;
            min-height: 48px;

            display: flex;
            align-items: flex-end;

            gap: 4px;
            padding: 7px 8px 0;

            background:
                linear-gradient(
                    180deg,
                    #161616,
                    #090909
                );

            border-bottom: 1px solid #242424;
        }

        .tab {
            height: 40px;
            min-width: 145px;
            max-width: 240px;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 0 10px;

            border: 1px solid #272727;
            border-bottom: none;

            border-radius: 10px 10px 0 0;

            background:
                linear-gradient(
                    180deg,
                    #161616,
                    #0b0b0b
                );

            color: #a8a8a8;

            cursor: pointer;

            transition:
                background .18s ease,
                color .18s ease,
                transform .18s ease;
        }

        .tab:hover {
            color: white;
            background: #181818;
        }

        .tab.active {
            color: white;

            background:
                linear-gradient(
                    180deg,
                    #1d1d1d,
                    #0d0d0d
                );

            box-shadow:
                inset 0 2px 0 rgba(255, 0, 0, .7);
        }

        .tab-icon {
            width: 23px;
            height: 23px;

            display: grid;
            place-items: center;

            border-radius: 7px;

            background:
                linear-gradient(
                    145deg,
                    #ff2222,
                    #760000
                );

            box-shadow:
                0 0 12px rgba(255, 0, 0, .25);

            font-weight: 900;
            font-size: 12px;
        }

        .tab-title {
            flex: 1;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 13px;
        }

        .tab-close {
            width: 24px;
            height: 24px;

            border: none;
            background: transparent;

            border-radius: 6px;

            color: #777;

            cursor: pointer;
        }

        .tab-close:hover {
            background: #2b1111;
            color: white;
        }

        #newTabButton {
            width: 40px;
            height: 40px;

            border: none;
            background: transparent;

            color: #aaa;

            font-size: 22px;

            cursor: pointer;

            border-radius: 8px;
        }

        #newTabButton:hover {
            color: white;
            background: #171717;
        }

        /* =========================
           TOOLBAR
        ========================= */

        #toolbar {
            height: 56px;
            min-height: 56px;

            display: flex;
            align-items: center;

            gap: 7px;

            padding: 8px 12px;

            background:
                linear-gradient(
                    180deg,
                    #0d0d0d,
                    #070707
                );

            border-bottom: 1px solid #1d1d1d;
        }

        .toolbar-button {
            width: 35px;
            height: 35px;

            display: grid;
            place-items: center;

            border: 1px solid transparent;

            background: transparent;

            border-radius: 9px;

            color: #a0a0a0;

            cursor: pointer;

            font-size: 17px;

            transition: .15s ease;
        }

        .toolbar-button:hover {
            color: white;

            background: #151515;

            border-color: #292929;
        }

        .toolbar-button:active {
            transform: scale(.94);
        }

        #addressArea {
            flex: 1;

            height: 38px;

            display: flex;
            align-items: center;

            padding: 0 13px;

            border-radius: 12px;

            border: 1px solid #3a1616;

            background:
                linear-gradient(
                    180deg,
                    #111111,
                    #090909
                );

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.03);
        }

        #addressIcon {
            margin-right: 9px;
            color: #777;
        }

        #addressBar {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            font-size: 14px;
        }

        #addressBar::placeholder {
            color: #666;
        }

        #addressArea:focus-within {
            border-color: #8d1717;

            box-shadow:
                0 0 14px rgba(255, 0, 0, .12);
        }

        /* =========================
           CONTENT
        ========================= */

        #pageContainer {
            position: relative;

            flex: 1;

            min-height: 0;

            background: #050505;
        }

        .page {
            position: absolute;

            inset: 0;

            display: none;

            overflow: auto;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(130, 0, 0, .10),
                    transparent 42%
                ),
                #050505;
        }

        .page.active {
            display: block;
        }

        /* =========================
           HOME
        ========================= */

        .home {
            min-height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 70px 25px 50px;
        }

        .logo {
            width: 82px;
            height: 82px;

            display: grid;
            place-items: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    #ff2626,
                    #9c0000 48%,
                    #3b0000
                );

            border: 1px solid #ff3434;

            box-shadow:
                0 0 30px rgba(255, 0, 0, .20),
                inset 0 1px 0 rgba(255,255,255,.15);

            font-size: 31px;
            font-weight: 950;

            letter-spacing: -2px;

            margin-bottom: 22px;
        }

        .brand {
            font-size: 46px;
            font-weight: 900;

            letter-spacing: -2px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    #a5a5a5
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .subtitle {
            color: #777;

            margin-top: 8px;

            font-size: 14px;
        }

        #homeSearch {
            width: min(760px, 100%);

            height: 56px;

            display: flex;

            margin-top: 34px;

            padding: 5px;

            border-radius: 17px;

            border: 1px solid #481616;

            background:
                linear-gradient(
                    180deg,
                    #121212,
                    #080808
                );

            box-shadow:
                0 0 30px rgba(255,0,0,.08);
        }

        #homeSearch input {
            flex: 1;

            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            padding: 0 16px;

            font-size: 16px;
        }

        #homeSearch button {
            width: 100px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    #ff2222,
                    #8d0000
                );

            color: white;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 0 15px rgba(255,0,0,.18);
        }

        #homeSearch button:hover {
            filter: brightness(1.15);
        }

        .quick-links {
            width: min(760px, 100%);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 22px;
        }

        .quick-link {
            min-height: 76px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 7px;

            border: 1px solid #242424;

            border-radius: 13px;

            background:
                linear-gradient(
                    180deg,
                    #141414,
                    #0a0a0a
                );

            color: #aaa;

            cursor: pointer;

            transition: .18s ease;
        }

        .quick-link:hover {
            color: white;

            border-color: #651818;

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.35);
        }

        .quick-icon {
            font-size: 20px;
        }

        .quick-text {
            font-size: 12px;
        }

        .home-grid {
            width: min(900px, 100%);

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;

            margin-top: 30px;
        }

        .home-card {
            min-height: 150px;

            padding: 20px;

            border: 1px solid #252525;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #090909
                );

            box-shadow:
                var(--shadow);
        }

        .home-card h3 {
            margin: 0 0 9px;

            font-size: 15px;
        }

        .home-card p {
            margin: 0;

            color: #777;

            line-height: 1.5;

            font-size: 13px;
        }

        /* =========================
           SEARCH RESULTS
        ========================= */

        .results-page {
            padding: 28px 25px 60px;
        }

        .results-header {
            width: min(900px, 100%);

            margin: 0 auto 25px;
        }

        .results-title {
            font-size: 24px;
            font-weight: 800;

            margin-bottom: 7px;
        }

        .results-query {
            color: #777;

            font-size: 13px;
        }

        .result-list {
            width: min(900px, 100%);

            margin: 0 auto;
        }

        .result {
            padding: 19px 20px;

            margin-bottom: 12px;

            border-radius: 14px;

            border: 1px solid #252525;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #080808
                );

            transition: .18s ease;
        }

        .result:hover {
            border-color: #611717;

            box-shadow:
                0 8px 25px rgba(0,0,0,.25);
        }

        .result-title {
            display: block;

            color: #ff4a4a;

            font-size: 17px;
            font-weight: 750;

            text-decoration: none;

            margin-bottom: 7px;
        }

        .result-title:hover {
            color: #ff7a7a;
        }

        .result-url {
            color: #777;

            font-size: 12px;

            margin-bottom: 9px;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .result-snippet {
            color: #aaa;

            font-size: 13px;

            line-height: 1.5;
        }

        .search-message {
            width: min(700px, 100%);

            margin: 60px auto;

            text-align: center;

            color: #777;
        }

        .search-message strong {
            display: block;

            color: white;

            font-size: 20px;

            margin-bottom: 10px;
        }

        .search-message button {
            margin-top: 18px;

            border: 1px solid #651818;

            border-radius: 10px;

            padding: 10px 17px;

            background:
                linear-gradient(
                    145deg,
                    #a60000,
                    #5b0000
                );

            color: white;

            cursor: pointer;
        }

        /* =========================
           EMBEDDED WEBSITE
        ========================= */

        .browser-page {
            width: 100%;
            height: 100%;
            background: #080808;
        }

        .browser-frame {
            width: 100%;
            height: 100%;

            border: none;

            background: white;
        }

        /* =========================
           EMPTY PAGES
        ========================= */

        .empty-page {
            min-height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .empty-box {
            width: min(500px, 100%);

            padding: 35px;

            text-align: center;

            border-radius: 18px;

            border: 1px solid #292929;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #080808
                );
        }

        .empty-box h2 {
            margin-top: 0;
        }

        .empty-box p {
            color: #777;

            line-height: 1.5;
        }

        /* =========================
           SETTINGS
        ========================= */

        #settingsOverlay {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.72);

            z-index: 1000;
        }

        #settingsOverlay.open {
            display: flex;
        }

        .settings {
            width: min(550px, 100%);

            max-height: 85vh;

            overflow: auto;

            padding: 25px;

            border: 1px solid #551616;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #080808
                );

            box-shadow:
                0 20px 80px rgba(0,0,0,.65),
                0 0 35px rgba(255,0,0,.08);
        }

        .settings-head {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .settings-head h2 {
            margin: 0;
        }

        .settings-close {
            width: 34px;
            height: 34px;

            border: none;

            border-radius: 9px;

            background: #171717;

            color: #aaa;

            cursor: pointer;
        }

        .settings-row {
            padding: 16px 0;

            border-top: 1px solid #252525;
        }

        .settings-row label {
            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-weight: 700;
        }

        .settings-row select {
            width: 100%;

            padding: 11px;

            border-radius: 9px;

            border: 1px solid #333;

            background: #0c0c0c;

            color: white;

            outline: none;
        }

        .danger-button {
            border: 1px solid #691818;

            border-radius: 9px;

            padding: 10px 14px;

            background: #280909;

            color: #ff7777;

            cursor: pointer;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 750px) {
            .quick-links {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .home-grid {
                grid-template-columns: 1fr;
            }

            .brand {
                font-size: 38px;
            }

            .tab {
                min-width: 120px;
            }
        }

        @media (max-width: 520px) {
            #toolbar {
                gap: 3px;
                padding: 7px;
            }

            .toolbar-button {
                width: 31px;
                height: 31px;
            }

            #homeSearch {
                height: 52px;
            }

            #homeSearch button {
                width: 80px;
            }

            .tab {
                min-width: 105px;
            }

            .tab-title {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- =========================
         TAB BAR
    ========================== -->

    <div id="tabBar">

        <div
            class="tab active"
            data-tab-id="1"
            onclick="switchTab(1)"
        >
            <div class="tab-icon">C</div>

            <div class="tab-title">
                New Tab
            </div>

            <button
                class="tab-close"
                onclick="event.stopPropagation(); closeTab(1)"
                title="Close tab"
            >
                ×
            </button>
        </div>

        <button
            id="newTabButton"
            onclick="createNewTab()"
            title="New tab"
        >
            +
        </button>

    </div>


    <!-- =========================
         TOOLBAR
    ========================== -->

    <div id="toolbar">

        <button
            class="toolbar-button"
            onclick="goBack()"
            title="Back"
        >
            ←
        </button>

        <button
            class="toolbar-button"
            onclick="goForward()"
            title="Forward"
        >
            →
        </button>

        <button
            class="toolbar-button"
            onclick="reloadPage()"
            title="Reload"
        >
            ↻
        </button>

        <button
            class="toolbar-button"
            onclick="goHome()"
            title="Home"
        >
            ⌂
        </button>


        <div id="addressArea">

            <span id="addressIcon">
                ◉
            </span>

            <input
                id="addressBar"
                type="text"
                placeholder="Search or enter a website"
                autocomplete="off"
                spellcheck="false"
                onkeydown="addressKeyDown(event)"
            >

        </div>


        <button
            class="toolbar-button"
            onclick="toggleBookmark()"
            title="Bookmark"
        >
            ☆
        </button>

        <button
            class="toolbar-button"
            onclick="openSettings()"
            title="Settings"
        >
            ⚙
        </button>

        <button
            class="toolbar-button"
            onclick="openHistory()"
            title="History"
        >
            ⋮
        </button>

    </div>


    <!-- =========================
         PAGES
    ========================== -->

    <div id="pageContainer">

        <div
            id="page-1"
            class="page active"
        ></div>

    </div>

</div>


<!-- =========================
     SETTINGS
========================== -->

<div
    id="settingsOverlay"
    onclick="settingsBackgroundClick(event)"
>

    <div class="settings">

        <div class="settings-head">

            <h2>
                Chox Settings
            </h2>

            <button
                class="settings-close"
                onclick="closeSettings()"
            >
                ×
            </button>

        </div>


        <div class="settings-row">

            <label>
                Search provider
            </label>

            <select id="searchProvider">

                <option value="searx">
                    SearXNG
                </option>

            </select>

        </div>


        <div class="settings-row">

            <label>
                SearXNG instance
            </label>

            <select
                id="searxInstance"
                onchange="saveSettings()"
            >

                <option value="https://searx.tiekoetter.com">
                    searx.tiekoetter.com
                </option>

                <option value="https://search.catboy.house">
                    search.catboy.house
                </option>

                <option value="https://search.ctq.ro">
                    search.ctq.ro
                </option>

                <option value="https://search.lumy.live">
                    search.lumy.live
                </option>

            </select>

        </div>


        <div class="settings-row">

            <label>
                Quick links
            </label>

            <select
                id="quickLinksSetting"
                onchange="saveSettings()"
            >

                <option value="show">
                    Show
                </option>

                <option value="hide">
                    Hide
                </option>

            </select>

        </div>


        <div class="settings-row">

            <button
                class="danger-button"
                onclick="clearHistory()"
            >
                Clear browsing history
            </button>

        </div>

    </div>

</div>


<script>
/* =========================================================
   CHOX BROWSER CORE
   Everything is contained in this file.
========================================================= */

"use strict";


/* =========================================================
   STATE
========================================================= */

const tabs = new Map();

let activeTabId = 1;

let nextTabId = 2;

let searchHistory = [];

let bookmarks = [];

let settings = {
    searchProvider: "searx",
    searxInstance: "https://searx.tiekoetter.com",
    quickLinks: "show"
};


/* =========================================================
   LOAD SAVED DATA
========================================================= */

function loadSavedData() {

    try {

        searchHistory =
            JSON.parse(
                localStorage.getItem("choxHistory") || "[]"
            );

    } catch {

        searchHistory = [];

    }


    try {

        bookmarks =
            JSON.parse(
                localStorage.getItem("choxBookmarks") || "[]"
            );

    } catch {

        bookmarks = [];

    }


    try {

        const saved =
            JSON.parse(
                localStorage.getItem("choxSettings") || "{}"
            );

        settings = {
            ...settings,
            ...saved
        };

    } catch {}

}


/* =========================================================
   SAVE DATA
========================================================= */

function saveData() {

    localStorage.setItem(
        "choxHistory",
        JSON.stringify(searchHistory)
    );

    localStorage.setItem(
        "choxBookmarks",
        JSON.stringify(bookmarks)
    );

    localStorage.setItem(
        "choxSettings",
        JSON.stringify(settings)
    );

}


/* =========================================================
   TAB CREATION
========================================================= */

function createTabElement(tab) {

    const tabBar =
        document.getElementById("tabBar");

    const newButton =
        document.getElementById("newTabButton");


    const element =
        document.createElement("div");

    element.className = "tab";

    element.dataset.tabId = tab.id;

    element.innerHTML = `
        <div class="tab-icon">C</div>

        <div class="tab-title">
            ${escapeHtml(tab.title)}
        </div>

        <button
            class="tab-close"
            title="Close tab"
        >
            ×
        </button>
    `;


    element.addEventListener(
        "click",
        () => switchTab(tab.id)
    );


    element
        .querySelector(".tab-close")
        .addEventListener(
            "click",
            event => {

                event.stopPropagation();

                closeTab(tab.id);

            }
        );


    tabBar.insertBefore(
        element,
        newButton
    );

}


function createPageElement(tab) {

    const container =
        document.getElementById("pageContainer");


    const page =
        document.createElement("div");

    page.id =
        "page-" + tab.id;

    page.className =
        "page";


    container.appendChild(page);

}


/* =========================================================
   CREATE NEW TAB
========================================================= */

function createNewTab(url = "") {

    const id = nextTabId++;

    const tab = {

        id,

        title: "New Tab",

        url: "",

        type: "home",

        history: [],

        historyIndex: -1

    };


    tabs.set(id, tab);

    createTabElement(tab);

    createPageElement(tab);

    switchTab(id);

    if (url) {

        navigate(url);

    } else {

        renderHome(tab);

    }

}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(id) {

    if (!tabs.has(id)) {
        return;
    }


    const tabElement =
        document.querySelector(
            `.tab[data-tab-id="${id}"]`
        );

    const pageElement =
        document.getElementById(
            "page-" + id
        );


    if (tabElement) {
        tabElement.remove();
    }

    if (pageElement) {
        pageElement.remove();
    }


    tabs.delete(id);


    if (tabs.size === 0) {

        createNewTab();

        return;

    }


    if (activeTabId === id) {

        const remaining =
            Array.from(tabs.keys());

        switchTab(
            remaining[remaining.length - 1]
        );

    }

}


/* =========================================================
   SWITCH TAB
========================================================= */

function switchTab(id) {

    if (!tabs.has(id)) {
        return;
    }


    activeTabId = id;


    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                Number(tab.dataset.tabId) === id
            );

        });


    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });


    const page =
        document.getElementById(
            "page-" + id
        );


    if (page) {
        page.classList.add("active");
    }


    updateAddressBar();

}


/* =========================================================
   UPDATE TAB
========================================================= */

function updateTab(tab) {

    const element =
        document.querySelector(
            `.tab[data-tab-id="${tab.id}"]`
        );

    if (!element) {
        return;
    }


    const title =
        element.querySelector(".tab-title");


    if (title) {

        title.textContent =
            tab.title || "New Tab";

    }

}


/* =========================================================
   ADDRESS BAR
========================================================= */

function updateAddressBar() {

    const tab = tabs.get(activeTabId);

    const address =
        document.getElementById("addressBar");


    if (!tab) {
        return;
    }


    if (tab.type === "home") {

        address.value = "";

    } else {

        address.value =
            tab.url || "";

    }

}


function addressKeyDown(event) {

    if (event.key !== "Enter") {
        return;
    }

    openAddress();

}


function openAddress() {

    const address =
        document
            .getElementById("addressBar")
            .value
            .trim();


    if (!address) {
        return;
    }


    navigate(address);

}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(input) {

    const tab = tabs.get(activeTabId);

    if (!tab) {
        return;
    }


    let value = input.trim();


    if (!value) {
        return;
    }


    /*
       If it looks like a normal website URL,
       load it as a website.
    */

    if (
        /^https?:\/\//i.test(value)
    ) {

        openWebsite(value);

        return;

    }


    /*
       Local Chox pages.
    */

    if (
        value === "chox://home" ||
        value === "chox://"
    ) {

        goHome();

        return;

    }


    if (
        value === "chox://history"
    ) {

        openHistory();

        return;

    }


    if (
        value === "chox://bookmarks"
    ) {

        openBookmarks();

        return;

    }


    if (
        value === "chox://settings"
    ) {

        openSettings();

        return;

    }


    /*
       If it looks like a domain,
       add HTTPS.
    */

    if (
        /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(value)
    ) {

        openWebsite(
            "https://" + value
        );

        return;

    }


    /*
       Otherwise treat it as a search.
    */

    performSearch(value);

}


/* =========================================================

/* =========================================================
   SEARCH
========================================================= */

async function performSearch(query) {

    const tab = tabs.get(activeTabId);

    if (!tab) {
        return;
    }


    query = query.trim();

    if (!query) {
        return;
    }


    tab.type = "search";

    tab.url =
        "chox://search?q=" +
        encodeURIComponent(query);

    tab.title =
        "Search: " + query;


    updateTab(tab);

    updateAddressBar();


    addHistory({
        type: "search",
        query,
        url: tab.url
    });


    renderSearchLoading(
        tab,
        query
    );


    try {

        const base =
            settings.searxInstance
                .replace(/\/+$/, "");


        const url =
            base +
            "/search?q=" +
            encodeURIComponent(query) +
            "&format=json" +
            "&language=en" +
            "&safesearch=1" +
            "&pageno=1";


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "SearXNG returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        const results =
            Array.isArray(data.results)
                ? data.results
                : [];


        renderSearchResults(
            tab,
            query,
            results
        );


    } catch (error) {

        console.error(
            "Chox SearXNG error:",
            error
        );


        renderSearchError(
            tab,
            query,
            error
        );

    }

}


/* =========================================================
   SEARCH LOADING
========================================================= */

function renderSearchLoading(
    tab,
    query
) {

    const page =
        document.getElementById(

        );


    if (!page) {

    }


    page.innerHTML = `

            <div class="results-header">

                <div class="results-title">
                    Searching...
                </div>

                <div class="results-query">
                    ${escapeHtml(query)}
                </div>

            </div>


            <div class="search-message">

                <strong>
                    Searching the web
                </strong>

                <div>
                    Chox is asking SearXNG
                    for results.
                </div>

            </div>

        </div>
    `;

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(
    tab,
    query,
    results
) {

    const page =
        document.getElementById(
            "page-" + tab.id
        );


    if (!page) {
        return;
    }


    if (!results.length) {

        page.innerHTML = `

            <div class="results-page">

                <div class="results-header">

                    <div class="results-title">
                        Search
                    </div>

                    <div class="results-query">
                        ${escapeHtml(query)}
                    </div>

                </div>


                <div class="search-message">

                    <strong>
                        No results found
                    </strong>

                    <div>
                        SearXNG did not return
                        any results for this search.
                    </div>

                </div>

            </div>
        `;

        return;

    }


    const resultHtml =
        results
            .map(
                (result) => {

                    const title =
                        result.title ||
                        "Untitled result";


                    const url =
                        result.url ||
                        "#";


                    const snippet =
                        result.content ||
                        result.description ||
                        "No description available.";


                    let domain = "";

                    try {

                        domain =
                            new URL(url).hostname;

                    } catch {

                        domain = url;

                    }


                    return `

                        <div class="result">

                            <a
                                class="result-title"
                                href="${escapeAttribute(url)}"
                                onclick="openResult(event, '${escapeAttribute(url)}')"
                            >
                                ${escapeHtml(title)}
                            </a>


                            <div class="result-url">
                                ${escapeHtml(domain)}
                            </div>


                            <div class="result-snippet">
                                ${escapeHtml(snippet)}
                            </div>

                        </div>
                    `;

                }
            )
            .join("");


    page.innerHTML = `

        <div class="results-page">

            <div class="results-header">

                <div class="results-title">
                    Search results
                </div>

                <div class="results-query">
                    Results for
                    <strong>
                        ${escapeHtml(query)}
                    </strong>
                </div>

            </div>


            <div class="result-list">

                ${resultHtml}

            </div>

        </div>
    `;

}


/* =========================================================
   SEARCH ERROR
========================================================= */

function renderSearchError(

    query,
    error
) {

    const page =

    if (!page) {

    tab.url = url;


    try {

        tab.title =
            new URL(url).hostname;

    } catch {

        tab.title = url;

    }


    updateTab(tab);

    updateAddressBar();

    renderWebsite(tab, url);

}

/* =========================================================

========================================================= */

function addHistory(item) {

    searchHistory.unshift({
        ...item,
        time: Date.now()
    });


    searchHistory =

    saveData();

}

    tab.type = "history";

                            )}

}


/* =========================================================
   BOOKMARKS
========================================================= */

function toggleBookmark() {

    const tab = tabs.get(activeTabId);

    if (!tab || !tab.url) {
        return;
    }


    const existing =
        bookmarks.find(
            item => item.url === tab.url
        );


    if (existing) {

        bookmarks =
            bookmarks.filter(
                item => item.url !== tab.url
            );

    } else {

        bookmarks.unshift({
            title:
                tab.title || tab.url,
            url: tab.url
        });

    }


    saveData();

}


function openBookmarks() {

    const tab = tabs.get(activeTabId);

    if (!tab) {
        return;

    tab.type = "bookmarks";

    const items =

                            onclick="openResult(event, '${escapeAttribute(item.url)}')"

                        <div class="result-url">

/* =========================================================
   BACK / FORWARD
========================================================= */

function goBack() {

    const tab = tabs.get(activeTabId);

    if (!tab) {
        return;
    }


    if (
        tab.historyIndex > 0
    ) {

        tab.historyIndex--;

        const item =
            tab.history[
                tab.historyIndex
            ];


        if (item) {

            restoreHistoryItem(
                tab,
                item
            );

        }

        return;

    }


    window.history.back();

}


function goForward() {

    const tab = tabs.get(activeTabId);

    if (!tab) {
        return;
    }


    if (
        tab.historyIndex <
        tab.history.length - 1
    ) {

        tab.historyIndex++;

        const item =
            tab.history[
                tab.historyIndex
            ];


        if (item) {

            restoreHistoryItem(
                tab,
                item
            );

        }

        return;

    }


    window.history.forward();

}


function restoreHistoryItem(
    tab,
    item
) {

    if (item.type === "home") {

        renderHome(tab);

    } else if (item.type === "search") {

        performSearch(item.query);

    } else if (item.type === "website") {

        renderWebsite(
            tab,
            item.url
        );

    }

}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

    const tab = tabs.get(activeTabId);

    if (!tab) {
        return;
    }


    if (tab.type === "home") {

        renderHome(tab);

        return;

    }


    if (tab.type === "search") {

        const match =
            tab.url.match(
                /[?&]q=([^&]+)/
            );


        if (match) {

            performSearch(
                decodeURIComponent(
                    match[1]
                )
            );

        }

        return;

    }


    if (
        tab.type === "website" &&
        tab.url
    ) {

        renderWebsite(
            tab,
            tab.url
        );

    }

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.add("open");


    document
        .getElementById(
            "searxInstance"
        )
        .value =
            settings.searxInstance;


    document
        .getElementById(
            "quickLinksSetting"
        )
        .value =
            settings.quickLinks;

}


function closeSettings() {

    document
        .getElementById(
            "settingsOverlay"
        )
        .classList.remove("open");

}


function settingsBackgroundClick(event) {

    if (
        event.target.id ===
        "settingsOverlay"
    ) {

        closeSettings();

    }

}


function saveSettings() {

    settings.searxInstance =
        document
            .getElementById(
                "searxInstance"
            )
            .value;


    settings.quickLinks =
        document
            .getElementById(
                "quickLinksSetting"
            )
            .value;


    saveData();


    const tab =
        tabs.get(activeTabId);


    if (
        tab &&
        tab.type === "home"
    ) {

        renderHome(tab);

    }

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

    searchHistory = [];

    saveData();

    openHistory();

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            (event.ctrlKey ||
                event.metaKey) &&
            event.key.toLowerCase() === "l"
        ) {

            event.preventDefault();

            const address =
                document.getElementById(
                    "addressBar"
                );

            address.focus();

            address.select();

        }


        if (
            (event.ctrlKey ||
                event.metaKey) &&
            event.key.toLowerCase() === "t"
        ) {

            event.preventDefault();

            createNewTab();

        }


        if (
            (event.ctrlKey ||
                event.metaKey) &&
            event.key.toLowerCase() === "w"
        ) {

            event.preventDefault();

            closeTab(activeTabId);

        }


        if (
            event.key === "Escape"
        ) {

            closeSettings();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadSavedData();


const firstTab = {

    id: 1,

    title: "New Tab",

    url: "",

    type: "home",

    history: [],

    historyIndex: -1

};


tabs.set(
    1,
    firstTab
);


renderHome(firstTab);

updateAddressBar();

</script>
