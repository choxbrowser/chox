<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Chox Browser</title>


<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background: #0b0c0f;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================
   BROWSER
========================================= */

.browser {

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #0b0c0f;
}


/* =========================================
   TAB BAR
========================================= */

.tab-bar {

    height: 42px;

    display: flex;
    align-items: flex-end;

    background: #15161a;

    padding-left: 8px;

    border-bottom:
        1px solid #292b31;
}


.tab {

    height: 34px;

    min-width: 210px;
    max-width: 280px;

    display: flex;
    align-items: center;

    gap: 9px;

    padding: 0 12px;

    background: #24262c;

    border-radius:
        10px 10px 0 0;

    color: #d8d9dd;

    font-size: 13px;

    position: relative;
}


.tab::before {

    content: "";

    width: 16px;
    height: 16px;

    border-radius: 50%;

    background: #e00000;
}


.tab-title {

    flex: 1;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.tab-close {

    border: 0;

    background: transparent;

    color: #999da6;

    font-size: 17px;

    cursor: pointer;

    padding: 2px 5px;
}


.tab-close:hover {

    color: white;

    background: #363941;

    border-radius: 5px;
}


.new-tab {

    width: 38px;
    height: 34px;

    border: 0;

    background: transparent;

    color: #c8c9ce;

    font-size: 21px;

    cursor: pointer;
}


.new-tab:hover {

    background: #292b31;

    border-radius: 8px;
}


/* =========================================
   TOOLBAR
========================================= */

.toolbar {

    height: 58px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding:
        8px 12px;

    background: #1b1c20;

    border-bottom:
        1px solid #292b31;
}


/* =========================================
   NAVIGATION BUTTONS
========================================= */

.nav-button {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    background: transparent;

    color: #d5d6da;

    font-size: 20px;

    cursor: pointer;
}


.nav-button:hover {

    background: #303239;
}


/* =========================================
   ADDRESS BAR
========================================= */

.address-area {

    flex: 1;

    height: 40px;

    display: flex;
    align-items: center;

    background: #292b31;

    border-radius: 21px;

    padding: 0 14px;

    min-width: 100px;
}


.lock {

    color: #9da1aa;

    font-size: 14px;

    margin-right: 9px;
}


.address-input {

    flex: 1;

    width: 100%;

    border: 0;
    outline: 0;

    background: transparent;

    color: #ffffff;

    font-size: 15px;
}


.address-input::placeholder {

    color: #9a9da5;
}


.address-search {

    width: 30px;
    height: 30px;

    border: 0;

    background: transparent;

    color: #aaaeb7;

    cursor: pointer;

    font-size: 16px;
}


/* =========================================
   BOOKMARK
========================================= */

.bookmark {

    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 50%;

    background: transparent;

    color: #c8c9ce;

    font-size: 19px;

    cursor: pointer;
}


.bookmark:hover {

    background: #303239;
}


/* =========================================
   CONTENT
========================================= */

.content {

    flex: 1;

    position: relative;

    overflow: hidden;

    background: #08090c;
}


/* =========================================
   HOME PAGE
========================================= */

.home {

    width: 100%;
    height: 100%;

    overflow-y: auto;

    padding:
        55px 20px 50px;

    text-align: center;
}


.logo {

    font-size: 76px;

    font-weight: 900;

    letter-spacing: -6px;

    margin: 0;
}


.tagline {

    margin-top: 8px;
    margin-bottom: 35px;

    color: #9699a3;

    font-size: 18px;
}


/* =========================================
   HOME SEARCH
========================================= */

.home-search {

    width: 100%;

    max-width: 760px;

    height: 58px;

    margin:
        0 auto;

    display: flex;

    background: #121419;

    border:
        1px solid #2b2e36;

    border-radius: 18px;

    overflow: hidden;
}


.home-search input {

    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    font-size: 17px;

    padding:
        0 20px;
}


.home-search input::placeholder {

    color: #777b85;
}


.home-search button {

    border: 0;

    padding:
        0 28px;

    background: #e00000;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.home-search button:hover {

    background: #ff1717;
}


/* =========================================
   SAFE SEARCH
========================================= */

.safe-search {

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 14px;

    color: #a4a7b0;

    font-size: 14px;
}


/* =========================================
   QUICK LINKS
========================================= */

.quick-title {

    margin-top: 45px;
    margin-bottom: 18px;

    font-size: 16px;

    font-weight: bold;

    color: #d8d9de;
}


.quick-links {

    width: 100%;

    max-width: 760px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}


.site-link {

    min-height: 105px;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 8px;

    text-decoration: none;

    color: white;

    background: #111318;

    border:
        1px solid #272a31;

    border-radius: 15px;

    cursor: pointer;

    transition:
        transform .2s,
        background .2s,
        border-color .2s;
}


.site-link:hover {

    transform:
        translateY(-3px);

    background: #181a20;

    border-color:
        #e00000;
}


.site-icon {

    width: 40px;
    height: 40px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-radius: 11px;

    background: #23262d;

    font-size: 20px;

    font-weight: bold;
}


.site-name {

    font-size: 14px;

    font-weight: bold;
}


/* =========================================
   WEBSITE FRAME
========================================= */

#websiteFrame {

    display: none;

    width: 100%;
    height: 100%;

    border: 0;

    background: white;
}


/* =========================================
   BLOCKED PAGE
========================================= */

.blocked {

    display: none;

    position: absolute;

    inset: 0;

    justify-content: center;
    align-items: center;

    background: #08090c;

    text-align: center;

    padding: 25px;
}


.blocked-box {

    max-width: 500px;

    padding: 35px;

    background: #15171c;

    border:
        1px solid #2b2e35;

    border-radius: 20px;
}


.blocked-box h2 {

    margin-top: 0;
}


.blocked-box p {

    color: #999da7;

    line-height: 1.6;
}


.open-site {

    display: inline-block;

    margin-top: 12px;

    padding:
        12px 22px;

    background: #e00000;

    color: white;

    text-decoration: none;

    border-radius: 10px;

    font-weight: bold;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .tab {

        min-width: 150px;
    }

    .bookmark {

        display: none;
    }

    .logo {

        font-size: 58px;

        letter-spacing: -4px;
    }

    .home {

        padding-top: 40px;
    }

    .quick-links {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .toolbar {

        padding-left: 7px;
        padding-right: 7px;
    }

    .nav-button {

        width: 34px;
        height: 34px;
    }
}


@media (max-width: 450px) {

    .tab {

        min-width: 120px;
    }

    .tab-title {

        font-size: 12px;
    }

    .address-input {

        font-size: 13px;
    }

    .home-search button {

        padding:
            0 18px;
    }
}

</style>

</head>


<body>


<div class="browser">


    <!-- =====================================
         TABS
    ====================================== -->

    <div class="tab-bar">

        <div class="tab">

            <div class="tab-title">
                Chox
            </div>

            <button
                class="tab-close"
                onclick="goHome()"
            >
                ×
            </button>

        </div>


        <button
            class="new-tab"
            onclick="goHome()"
        >
            +
        </button>

    </div>


    <!-- =====================================
         TOOLBAR
    ====================================== -->

    <div class="toolbar">


        <button
            class="nav-button"
            onclick="goBack()"
            title="Back"
        >
            ←
        </button>


        <button
            class="nav-button"
            onclick="goForward()"
            title="Forward"
        >
            →
        </button>


        <button
            class="nav-button"
            onclick="reloadPage()"
            title="Reload"
        >
            ↻
        </button>


        <button
            class="nav-button"
            onclick="goHome()"
            title="Home"
        >
            ⌂
        </button>


        <div class="address-area">

            <span class="lock">
                🔒
            </span>

            <input
                id="addressInput"
                class="address-input"
                type="text"
                placeholder="Search Chox or enter an address"
                autocomplete="off"
                spellcheck="false"
            >

            <button
                class="address-search"
                onclick="addressSearch()"
            >
                🔍
            </button>

        </div>


        <button
            class="bookmark"
            onclick="bookmarkPage()"
            title="Bookmark"
        >
            ☆
        </button>


    </div>


    <!-- =====================================
         CONTENT
    ====================================== -->

    <div class="content">


        <!-- HOME -->

        <div
            id="home"
            class="home"
        >

            <h1 class="logo">
                Chox
            </h1>


            <div class="tagline">
                Search the web your way.
            </div>


            <!-- HOME SEARCH -->

            <form
                id="homeSearch"
                class="home-search"
            >

                <input
                    id="homeInput"
                    type="text"
                    placeholder="Search Chox..."
                    autocomplete="off"
                    required
                >


                <button type="submit">
                    Search
                </button>

            </form>


            <!-- SAFE SEARCH -->

            <label class="safe-search">

                <input
                    id="safeSearch"
                    type="checkbox"
                    checked
                >

                <span>
                    Safe Search
                </span>

            </label>


            <!-- QUICK LINKS -->

            <div class="quick-title">
                Quick Links
            </div>


            <div class="quick-links">


                <a
                    class="site-link"
                    href="https://www.youtube.com/"
                    onclick="openSite(event, this.href, 'YouTube')"
                >

                    <div class="site-icon">
                        ▶
                    </div>

                    <div class="site-name">
                        YouTube
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://www.facebook.com/"
                    onclick="openSite(event, this.href, 'Facebook')"
                >

                    <div class="site-icon">
                        f
                    </div>

                    <div class="site-name">
                        Facebook
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://www.instagram.com/"
                    onclick="openSite(event, this.href, 'Instagram')"
                >

                    <div class="site-icon">
                        ◎
                    </div>

                    <div class="site-name">
                        Instagram
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://www.tiktok.com/"
                    onclick="openSite(event, this.href, 'TikTok')"
                >

                    <div class="site-icon">
                        ♪
                    </div>

                    <div class="site-name">
                        TikTok
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://www.reddit.com/"
                    onclick="openSite(event, this.href, 'Reddit')"
                >

                    <div class="site-icon">
                        ●
                    </div>

                    <div class="site-name">
                        Reddit
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://discord.com/"
                    onclick="openSite(event, this.href, 'Discord')"
                >

                    <div class="site-icon">
                        ☁
                    </div>

                    <div class="site-name">
                        Discord
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://github.com/"
                    onclick="openSite(event, this.href, 'GitHub')"
                >

                    <div class="site-icon">
                        ◉
                    </div>

                    <div class="site-name">
                        GitHub
                    </div>

                </a>


                <a
                    class="site-link"
                    href="https://www.google.com/"
                    onclick="openSite(event, this.href, 'Google')"
                >

                    <div class="site-icon">
                        G
                    </div>

                    <div class="site-name">
                        Google
                    </div>

                </a>


            </div>

        </div>


        <!-- WEBSITE -->

        <iframe
            id="websiteFrame"
            title="Chox Web View"
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-same-origin allow-scripts"
        >
        </iframe>


        <!-- BLOCKED MESSAGE -->

        <div
            id="blocked"
            class="blocked"
        >

            <div class="blocked-box">

                <h2>
                    Website can't be displayed here
                </h2>

                <p>
                    This website doesn't allow itself
                    to be displayed inside another website.
                </p>

                <a
                    id="openSiteButton"
                    class="open-site"
                    href="#"
                >
                    Open Website
                </a>

            </div>

        </div>


    </div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const home =
    document.getElementById("home");

const frame =
    document.getElementById("websiteFrame");

const blocked =
    document.getElementById("blocked");

const openSiteButton =
    document.getElementById("openSiteButton");

const addressInput =
    document.getElementById("addressInput");

const homeInput =
    document.getElementById("homeInput");

const homeSearch =
    document.getElementById("homeSearch");


/* =========================================
   OPEN SITE
========================================= */

function openSite(
    event,
    url,
    name
) {

    event.preventDefault();


    home.style.display = "none";

    blocked.style.display = "none";

    frame.style.display = "block";


    frame.src = url;


    addressInput.value = url;


    document.title =
        name + " - Chox";


    openSiteButton.href = url;

}


/* =========================================
   HOME
========================================= */

function goHome() {

    frame.style.display = "none";

    blocked.style.display = "none";

    home.style.display = "block";


    frame.src = "";


    addressInput.value = "";


    document.title =
        "Chox Browser";

}


/* =========================================
   BACK
========================================= */

function goBack() {

    if (
        frame.style.display === "block"
    ) {

        try {

            frame.contentWindow.history.back();

        }

        catch (error) {

            goHome();

        }

    }

    else {

        window.history.back();

    }

}


/* =========================================
   FORWARD
========================================= */

function goForward() {

    if (
        frame.style.display === "block"
    ) {

        try {

            frame.contentWindow.history.forward();

        }

        catch (error) {

            console.log(error);

        }

    }

}


/* =========================================
   RELOAD
========================================= */

function reloadPage() {

    if (
        frame.style.display === "block"
    ) {

        frame.src =
            frame.src;

    }

    else {

        location.reload();

    }

}


/* =========================================
   ADDRESS BAR
========================================= */

function addressSearch() {

    const value =
        addressInput.value.trim();


    if (!value) {

        return;

    }


    openAddress(value);

}


addressInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            addressSearch();

        }

    }
);


/* =========================================
   OPEN ADDRESS
========================================= */

function openAddress(value) {

    /*
     * Detect normal URLs.
     */

    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        openSite(
            {
                preventDefault: function() {}
            },
            value,
            "Website"
        );

        return;

    }


    /*
     * Detect common domains.
     */

    if (
        value.includes(".")
        &&
        !value.includes(" ")
    ) {

        openSite(
            {
                preventDefault: function() {}
            },
            "https://" + value,
            value
        );

        return;

    }


    /*
     * Otherwise search Chox.
     */

    searchChox(value);

}


/* =========================================
   SEARCH
========================================= */

function searchChox(query) {

    query =
        query.trim();


    if (!query) {

        return;

    }


    window.location.href =
        "results.html?q=" +
        encodeURIComponent(query);

}


/* =========================================
   HOME SEARCH
========================================= */

homeSearch.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const query =
            homeInput.value.trim();


        if (!query) {

            homeInput.focus();

            return;

        }


        searchChox(query);

    }
);


/* =========================================
   BOOKMARK
========================================= */

function bookmarkPage() {

    const url =
        addressInput.value;


    if (!url) {

        alert(
            "You are currently on the Chox homepage."
        );

        return;

    }


    alert(
        "Bookmarking is controlled by your browser."
    );

}


/* =========================================
   KEYBOARD SHORTCUT
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /*
         * Ctrl + L
         */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "l"
        ) {

            event.preventDefault();

            addressInput.focus();

            addressInput.select();

        }

    }
);

</script>

</body>
</html>
